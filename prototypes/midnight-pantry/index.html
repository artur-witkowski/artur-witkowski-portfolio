<title>Midnight Pantry</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap">
<style>
/* Layout: the phone screen IS the kitchen at midnight. Title = closed fridge door with magnet letters.
   Game = open fridge (frosty freezer with monsters on top, lit cavity with your glass shelf), wooden counter with the day's groceries below.
   Transitions: door opens/closes, night darkens the fridge, merges cook in a pan, mornings print a receipt. Single deliberate look. */
:root{
  --ink:#140E1C; --paper:#FFF9E8; --text:#F4EFE6; --muted:#A79FBF;
  --enamel:#E6ECF1; --enamel-d:#B9C6D2; --frost:#BFDDE9; --night:#151B2E;
  --gold:#FFC93C; --atk:#FF8A1F; --hp:#F0405A;
  --orange:#FF7A1A; --orange-d:#B34D00; --blue:#2F7CF6; --blue-d:#1B4FA8; --green:#27C46B; --green-d:#17834A;
  --red:#EF4444; --red-d:#A12828; --gray:#4A4560; --gray-d:#2D2A3D;
  --r1:#B9B2C8; --r2:#4FA3FF; --r3:#C77DFF;
  --f:'Jersey 10','Courier New',monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#0F1220;color:var(--text);font-family:var(--f);font-size:20px;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
img.px,.pxbg{image-rendering:pixelated;image-rendering:crisp-edges}
img.px{display:block}
.crt{position:fixed;inset:0;pointer-events:none;z-index:300;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
.crt::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.55) 100%)}
#wall{position:fixed;inset:0;background-image:var(--tex-tiles);background-size:64px 64px;image-rendering:pixelated;z-index:0}
#wall::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 45%,rgba(190,225,255,.10),transparent 70%)}
#app{position:relative;z-index:1;height:100%;max-width:440px;margin:0 auto;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-direction:column;perspective:1400px}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}

/* buttons */
.btn{font-family:var(--f);font-size:24px;letter-spacing:.02em;color:#fff;border-radius:12px;padding:10px 12px;line-height:1;box-shadow:0 5px 0 var(--d,#000);transition:transform .06s,box-shadow .06s;text-shadow:1px 2px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--d,#000)}
.btn[disabled]{filter:grayscale(.8) brightness(.6);pointer-events:none}
.b-orange{background:var(--orange);--d:var(--orange-d)}.b-blue{background:var(--blue);--d:var(--blue-d)}.b-green{background:var(--green);--d:var(--green-d)}.b-red{background:var(--red);--d:var(--red-d)}.b-gray{background:var(--gray);--d:var(--gray-d)}
.wiggle{animation:wig 2.6s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}

/* ---------- DOOR (title + transitions) ---------- */
#door{position:absolute;inset:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));z-index:90;transform-origin:left center;border-radius:26px 26px 18px 18px;background-color:var(--enamel);background-image:linear-gradient(90deg,rgba(255,255,255,.35),transparent 18%,transparent 80%,rgba(80,100,120,.25)),var(--tex-enamel);background-size:auto,64px 64px;box-shadow:inset 0 -10px 0 var(--enamel-d),0 30px 60px rgba(0,0,0,.6);color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:22px 46px 22px 22px;box-sizing:border-box;gap:16px;backface-visibility:hidden}
#door .seam{position:absolute;left:0;right:0;top:27%;height:6px;background:var(--enamel-d);box-shadow:0 2px 0 rgba(255,255,255,.6)}
#door .handle{position:absolute;right:14px;width:12px;border-radius:6px;background:linear-gradient(90deg,#F4F4F4,#9BA3AD);box-shadow:3px 3px 0 rgba(0,0,0,.25)}
#door .h1{top:8%;height:13%}#door .h2{top:34%;height:22%}
#door .badge{position:absolute;top:14px;right:44px;font-size:14px;letter-spacing:.24em;padding:2px 8px;border-radius:4px;color:#5d5850;background:linear-gradient(180deg,#F4F4F4,#9BA3AD)}
.mlogo{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:6%}
.mword{display:flex;gap:2px}
.mletter{display:inline-block;font-size:clamp(48px,14vw,66px);line-height:.9;color:var(--c);transform:rotate(var(--r));text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),5px 7px 0 rgba(0,0,0,.25)}
.parade{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6%}
.parade img{width:48px;height:48px;animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.25))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
.titlebtns{display:flex;flex-direction:column;gap:12px;width:min(100%,280px);margin-top:auto}
.titlebtns .btn{font-size:28px;padding:14px}
.sticky{background:#FFE98A;color:#3A2E10;padding:10px 12px 8px;transform:rotate(-2deg);box-shadow:3px 5px 0 rgba(0,0,0,.2);font-size:20px;line-height:1.1;width:min(100%,260px);text-align:left;position:relative}
.sticky::before{content:"";position:absolute;top:-8px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--hp);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.sticky b{color:#B3261E;font-weight:400}
.dishmags{position:absolute;left:18px;bottom:22px;display:flex;flex-wrap:wrap;gap:4px;width:150px;pointer-events:none}
.dishmags img{width:32px;height:32px;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.3))}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:8px;height:44px}
.jar{position:relative;width:34px;height:42px;border:3px solid var(--ink);border-top-width:6px;border-radius:6px 6px 10px 10px;background:rgba(220,235,245,.25);overflow:hidden;box-sizing:border-box}
.jar i{position:absolute;left:0;right:0;bottom:0;background:#F3E3BC;transition:height .5s;box-shadow:inset 0 3px 0 #FFF6DA}
.jar i::after{content:"";position:absolute;left:5px;top:6px;width:4px;height:4px;background:#fff;animation:bub 1.8s infinite}
@keyframes bub{0%{transform:translateY(8px);opacity:0}50%{opacity:1}100%{transform:translateY(-6px);opacity:0}}
.jarlbl{display:flex;flex-direction:column;line-height:.9;font-size:16px;color:var(--muted)}
.jarlbl b{font-weight:400;font-size:24px;color:#FFE3A8}
.cal{width:44px;height:42px;background:var(--paper);color:var(--ink);border-radius:4px;display:flex;flex-direction:column;align-items:center;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.4);margin-left:6px}
.cal b{width:100%;background:var(--hp);color:#fff;font-weight:400;font-size:14px;text-align:center;line-height:14px}
.cal span{font-size:28px;line-height:26px}
.clock{font-size:26px;color:#9FE6FF;background:#0B1424;border:2px solid #22324F;border-radius:8px;padding:2px 8px;text-shadow:0 0 6px rgba(120,220,255,.7);font-variant-numeric:tabular-nums}
.hud .sp{flex:1}
.coins{display:flex;align-items:center;gap:6px;font-size:28px;color:var(--gold);text-shadow:2px 2px 0 rgba(0,0,0,.6)}
.coins img{width:24px;height:24px}
.iconbtn{width:36px;height:36px;border-radius:10px;background:rgba(20,16,30,.8);border:2px solid #3D3456;display:grid;place-items:center;font-size:22px}

/* ---------- FRIDGE ---------- */
.fridge{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px;border-radius:20px;background-color:var(--enamel);background-image:var(--tex-enamel);background-size:64px 64px;box-shadow:inset 0 -6px 0 var(--enamel-d),0 0 50px rgba(170,215,255,.18);gap:6px;position:relative}
.freezer{position:relative;border-radius:12px;padding:4px 6px 8px;background-color:var(--frost);background-image:var(--tex-frost);background-size:64px 64px;box-shadow:inset 0 0 0 3px #E8F6FB,inset 0 10px 18px rgba(80,140,170,.35);transition:box-shadow .6s,filter .6s}
.freezer::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:10px;background:radial-gradient(circle at 6px 0,#fff 5px,transparent 5.5px) repeat-x;background-size:14px 10px;opacity:.9;pointer-events:none}
.flab{font-size:16px;letter-spacing:.14em;color:#4E7F92;display:flex;justify-content:space-between;padding:0 4px}
.cavity{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;border-radius:12px;background:linear-gradient(180deg,rgba(255,252,235,.9),rgba(230,238,244,.6) 40%,rgba(210,222,232,.5));box-shadow:inset 0 0 0 3px rgba(255,255,255,.7);transition:background .6s;overflow:hidden}
.bulb{position:absolute;top:-2px;left:50%;width:44px;height:10px;margin-left:-22px;border-radius:0 0 10px 10px;background:#FFF6C8;box-shadow:0 0 22px 10px rgba(255,240,180,.55);transition:all .3s}
.cavity::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 55% at 50% 0%,rgba(255,244,190,.35),transparent 70%);pointer-events:none;transition:opacity .4s}
#center{flex:1;min-height:56px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:2px;padding:14px 10px 0;color:var(--ink);position:relative;z-index:2}
#center .ct{font-size:30px;line-height:1;color:#B3261E}
#center .cd{font-size:20px;line-height:1.1;max-width:330px;color:#2A2238}
#center .cd em{font-style:normal;color:#C2410C}
#center .tag{display:inline-block;font-size:15px;padding:1px 6px;border-radius:5px;background:var(--ink);color:var(--gold);margin-right:4px;vertical-align:2px}
.clash{display:flex;align-items:center;gap:16px}
.clash .n{font-size:54px;line-height:.9;text-shadow:3px 3px 0 var(--ink)}
.clash .n.a{color:var(--atk)}.clash .n.e{color:var(--hp)}
.clash .vs{font-size:18px;color:#5B5470}
.row{display:flex;gap:4px;justify-content:center;align-items:flex-end;min-height:96px;position:relative;z-index:2}
.shelfrow{padding:0 4px}
.glass{height:9px;margin:0 2px 6px;border-radius:3px;background:linear-gradient(180deg,rgba(255,255,255,.95) 0 2px,rgba(150,210,230,.55) 2px 7px,rgba(80,130,150,.5) 7px);position:relative;z-index:1}
.unit{position:relative;flex:0 1 64px;min-width:40px;width:64px;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .12s}
.unit .sp{width:64px;max-width:100%;height:auto;aspect-ratio:1;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.25))}
.unit.empty{height:84px;border:3px dashed rgba(90,110,130,.35);border-radius:12px;box-sizing:border-box}
.unit.sel{transform:translateY(-8px)}
.unit.sel .sp{filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 6px var(--gold))}
.unit.swapok{outline:2px dashed #C2410C;outline-offset:2px;border-radius:12px}
.unit.dead .sp{filter:grayscale(1) sepia(.6) hue-rotate(50deg) brightness(.55)}
.unit.dead{opacity:.6}
.unit.front::before{content:"▼";position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:14px;color:#C2410C}
.enemy.front::before{color:#B3261E}
.stars{height:16px;font-size:18px;line-height:16px;color:var(--gold);letter-spacing:-1px;text-shadow:1px 1px 0 var(--ink),-1px 0 0 var(--ink)}
.badges{display:flex;justify-content:space-between;width:64px;max-width:100%;margin-top:-10px;position:relative;z-index:2}
.bdg{min-width:24px;height:24px;padding:0 3px;box-sizing:border-box;border-radius:6px;display:grid;place-items:center;font-size:20px;color:#fff;border:2px solid var(--ink);text-shadow:1px 1px 0 rgba(0,0,0,.4)}
.bdg.a{background:var(--atk)}.bdg.h{background:var(--hp)}
.pips{display:flex;gap:3px;height:8px;margin-top:3px}
.pips i{width:8px;height:6px;border-radius:2px;background:rgba(60,70,90,.35)}
.pips i.on{background:var(--gold);box-shadow:0 0 0 1px var(--ink)}
.enemy .badges{width:100%}
.enemy.boss{flex-basis:96px;width:96px}.enemy.boss .sp{width:96px}
/* night */
#game.night .cavity{background:linear-gradient(180deg,rgba(30,40,70,.95),rgba(18,24,44,.97))}
#game.night .cavity::before{opacity:0}
#game.night .bulb{background:#5A5F70;box-shadow:none}
#game.night .freezer{box-shadow:inset 0 0 0 3px #E8F6FB,inset 0 0 26px rgba(120,230,255,.75),0 0 24px rgba(120,230,255,.35);filter:saturate(1.2)}
#game.night .fridge{background-color:#2A3346;box-shadow:inset 0 -6px 0 #1C2333,0 0 30px rgba(120,230,255,.12)}
#game.night #center{color:var(--text)}
#game.night #center .cd{color:#DCE6F5}
#game.night #center .cd em{color:var(--gold)}
#game.night #center .ct{color:var(--gold)}
#game.night .counter{filter:brightness(.45) saturate(.7)}
#game.night .glass{opacity:.5}
#game.night .unit.front::before{color:var(--gold)}

/* ---------- COUNTER ---------- */
.counter{position:relative;border-radius:14px 14px 10px 10px;padding:8px 8px 10px;background-color:#8A5A34;background-image:var(--tex-wood);background-size:128px 64px;box-shadow:inset 0 5px 0 #A9744A,0 5px 0 #4A2E18;transition:filter .6s}
.clabel{position:absolute;top:-12px;left:14px;background:var(--paper);color:var(--ink);font-size:16px;letter-spacing:.1em;padding:1px 8px;border-radius:4px;transform:rotate(-2deg);box-shadow:2px 2px 0 rgba(0,0,0,.3)}
.shop{display:flex;gap:8px;justify-content:center;align-items:flex-end;min-height:128px;padding-top:10px}
.card{position:relative;width:86px;height:118px;background:var(--paper);color:var(--ink);border:3px solid var(--rc,var(--r1));border-radius:10px;box-shadow:0 5px 0 rgba(40,20,10,.55),inset 0 0 0 2px var(--ink);display:flex;flex-direction:column;align-items:center;padding-top:6px;box-sizing:border-box;transition:transform .15s}
.card .sp{width:48px;height:48px;margin:2px 0}
.card .cn{font-size:18px;line-height:.95;text-align:center;padding:0 4px;min-height:34px;display:flex;align-items:center}
.card .cs{display:flex;gap:4px}
.card .cs .bdg{min-width:22px;height:22px;font-size:18px}
.card .price{position:absolute;top:-10px;right:-10px;width:30px;height:30px;border-radius:50%;background:var(--gold);border:2px solid var(--ink);display:grid;place-items:center;font-size:22px;color:var(--ink)}
.card .own{position:absolute;top:-10px;left:-8px;background:var(--green);color:#fff;border:2px solid var(--ink);border-radius:8px;font-size:16px;padding:0 5px}
.card.sel{transform:translateY(-14px) scale(1.06) rotate(0deg)!important;animation:none;box-shadow:0 0 0 3px var(--gold),0 10px 0 rgba(40,20,10,.55)}
.card.sold{visibility:hidden}
.card.poor{filter:brightness(.6)}
.actions{display:flex;gap:8px;height:54px;margin-top:6px}
.actions .btn{flex:1}
.actions .btn.grow{flex:1.7}

/* ---------- FX ---------- */
#fx{position:absolute;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.ftxt{position:absolute;white-space:nowrap;transform:translate(-50%,-50%);text-shadow:2px 2px 0 #000,-1px -1px 0 #000,2px -1px 0 #000,-1px 2px 0 #000}
.part{position:absolute;width:6px;height:6px}
#flash{position:absolute;inset:0;z-index:95;pointer-events:none;background:#FFFBEA;opacity:0}
#banner{position:absolute;left:0;right:0;top:34%;z-index:85;background:#7A0E1E;color:#FFE3A8;text-align:center;font-size:40px;padding:8px 0;box-shadow:0 0 0 4px var(--ink),0 0 40px rgba(240,64,90,.6);text-shadow:3px 3px 0 var(--ink)}
#banner small{display:block;font-size:20px;color:#FFB3C0}
.flashk{animation:flashk .25s}
@keyframes flashk{0%{filter:brightness(3) saturate(0)}100%{filter:none}}
.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.lungeU{animation:lu .28s ease-out}@keyframes lu{45%{transform:translateY(-22px) scale(1.14)}}
.lungeD{animation:ld .28s ease-out}@keyframes ld{45%{transform:translateY(22px) scale(1.14)}}
.hurt{animation:hurt .3s}@keyframes hurt{20%{transform:translateX(-5px) rotate(-6deg)}50%{transform:translateX(5px) rotate(5deg)}80%{transform:translateX(-2px)}}
.act{animation:actK .5s}@keyframes actK{40%{transform:translateY(-10px) scale(1.15)}}

/* ---------- OVERLAYS ---------- */
#overlay{position:absolute;inset:0;z-index:120;background:rgba(10,7,16,.6);display:flex;align-items:flex-end;justify-content:center;padding:16px 16px 0;overflow:hidden}
#overlay.mid{align-items:center;padding-bottom:16px}
.sheet{width:100%;max-width:380px;max-height:88%;overflow:auto;background:#1C1729;border:3px solid #3D3456;border-radius:16px;box-shadow:0 8px 0 rgba(0,0,0,.6);padding:18px;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-weight:400;font-size:40px;line-height:1;color:var(--gold);text-shadow:2px 3px 0 rgba(0,0,0,.6);text-align:center}
.sheet p{margin:0;font-size:20px;line-height:1.15;text-align:center}
.howto{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:20px;line-height:1.1}
.coll{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.coll div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:16px;text-align:center;line-height:.95}
.coll img{width:48px;height:48px}
.coll .lock img{filter:brightness(0) opacity(.45)}
.receipt{position:relative;width:min(100%,320px);background:#F7F3EA;color:#2A2238;padding:20px 20px 16px;font-size:22px;line-height:1.05;box-shadow:0 0 0 2px rgba(0,0,0,.1),0 -10px 40px rgba(0,0,0,.5);margin-bottom:0;display:flex;flex-direction:column;gap:6px}
.receipt::before{content:"";position:absolute;left:0;right:0;top:-10px;height:10px;background:linear-gradient(135deg,transparent 5px,#F7F3EA 5px) 0 0/10px 10px repeat-x,linear-gradient(225deg,transparent 5px,#F7F3EA 5px) 0 0/10px 10px repeat-x}
.receipt .rh{text-align:center;font-size:24px}
.receipt .rh small{display:block;font-size:18px;color:#6B6380}
.receipt .dash{border-top:2px dashed #B9B2C8;margin:4px 0}
.receipt .rr{display:flex;justify-content:space-between;opacity:0;transform:translateY(-4px);transition:opacity .15s,transform .15s}
.receipt .rr.in{opacity:1;transform:none}
.receipt .rr b{font-weight:400}
.receipt .bad{color:#B3261E}
.receipt .tot{display:flex;justify-content:space-between;font-size:32px}
.receipt .bar{height:34px;margin:6px 10px 2px;background:repeating-linear-gradient(90deg,#2A2238 0 2px,transparent 2px 4px,#2A2238 4px 7px,transparent 7px 9px,#2A2238 9px 10px,transparent 10px 13px)}
.receipt .note{font-size:18px;text-align:center;color:#6B6380}
.receipt .btn{margin-top:6px}
@media (max-height:700px){.row{min-height:84px}.unit{flex-basis:56px}.card{height:106px;width:80px}.card .sp{width:40px;height:40px}.shop{min-height:112px}#center{min-height:40px}#center .cd{font-size:17px}.hud{height:40px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div id="wall" aria-hidden="true"></div>
<div id="app">
  <section id="game" class="screen" hidden>
    <div class="hud">
      <div class="jar" aria-hidden="true"><i id="jarFill"></i></div>
      <div class="jarlbl"><span>ZAKWAS</span><b id="jarN"></b></div>
      <div class="cal" aria-label="Noc"><b>NOC</b><span id="calN">1</span></div>
      <div class="clock" id="clock">08:00</div>
      <div class="sp"></div>
      <div class="coins" id="coins"></div>
      <button class="iconbtn" data-act="mute" id="muteBtn" aria-label="Dźwięk">♪</button>
      <button class="iconbtn" data-act="help" aria-label="Jak grać">?</button>
    </div>
    <div class="fridge">
      <div class="freezer"><div class="flab"><span>ZAMRAŻALNIK</span><span id="eCount"></span></div><div class="row" id="eRow"></div></div>
      <div class="cavity">
        <div class="bulb"></div>
        <div id="center"></div>
        <div class="row shelfrow" id="tRow"></div>
        <div class="glass"></div>
      </div>
    </div>
    <div class="counter">
      <span class="clabel" id="clabel">ZAKUPY</span>
      <div class="shop" id="shop"></div>

/* ================= SOUND ================= */
let AC=null,muted=false,hum=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,vol,slide,delay){if(muted)return;const a=ac();if(!a)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
  g.gain.setValueAtTime(vol||.04,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03);}
function noise(d,freq,vol,q){if(muted)return;const a=ac();if(!a)return;const len=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,len,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.5);const s=a.createBufferSource();s.buffer=buf;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q||.7;
  const g=a.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(a.destination);s.start();}
function humOn(night){humOff();if(muted)return;const a=ac();if(!a)return;const o=a.createOscillator(),o2=a.createOscillator(),g=a.createGain();
  o.type='triangle';o.frequency.value=night?41:58;o2.type='sine';o2.frequency.value=night?61.7:116;g.gain.setValueAtTime(0,a.currentTime);g.gain.linearRampToValueAtTime(night?.05:.025,a.currentTime+.8);
  o.connect(g);o2.connect(g);g.connect(a.destination);o.start();o2.start();hum={o,o2,g,a,night};}
function humOff(){if(!hum)return;const{o,o2,g,a}=hum;g.gain.cancelScheduledValues(a.currentTime);g.gain.setValueAtTime(g.gain.value,a.currentTime);g.gain.linearRampToValueAtTime(0,a.currentTime+.25);o.stop(a.currentTime+.3);o2.stop(a.currentTime+.3);hum=null;}
const SFX={
  tap:()=>tone(700,.04,'square',.025),
  buy:()=>{tone(523,.06,'square',.04);tone(784,.09,'square',.04,0,.06);},
  plop:()=>tone(300,.09,'sine',.08,.5),
  coin:i=>tone(988+(i||0)*60,.07,'square',.035),
  tick:()=>tone(2400,.02,'square',.02),
  sizzle:()=>noise(.8,3500,.18,.6),
  merge:()=>[523,659,784,1046,1318,1568].forEach((f,i)=>tone(f,.14,'square',.045,0,i*.055)),
  hit:()=>{tone(180,.12,'sawtooth',.05,.45);noise(.08,900,.12);},
  hurt:()=>tone(120,.16,'square',.045,.6),
  splat:()=>noise(.25,500,.25,1.2),
  block:()=>tone(1400,.05,'triangle',.04),
  die:()=>tone(420,.3,'triangle',.05,.2),
  heal:()=>{tone(660,.08,'triangle',.04);tone(880,.1,'triangle',.04,0,.07);},
  thud:()=>{tone(90,.25,'sine',.25,.45);noise(.12,200,.3);},
  creak:()=>tone(220,.5,'sawtooth',.015,.6),
  ice:()=>noise(.15,6000,.12,2),
  boss:()=>[110,104,98].forEach((f,i)=>tone(f,.4,'sawtooth',.05,0,i*.35)),
  win:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.2,'triangle',.06,0,i*.1)),
  lose:()=>[392,330,262,196].forEach((f,i)=>tone(f,.24,'triangle',.06,0,i*.14)),
  whoosh:()=>tone(800,.18,'sawtooth',.018,.3)
};

/* ================= PIXEL TEXTURES (drawn small, scaled up crisp) ================= */
function tex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');fn(x,w,h);return c.toDataURL();}
function dots(x,n,cols,w,h){for(let i=0;i<n;i++){x.fillStyle=rnd(cols);x.fillRect(Math.floor(R(0,w)),Math.floor(R(0,h)),1,1);}}

/* ================= JUICE ================= */
function shake(p){if(RM)return;const t0=performance.now(),dur=180+p*40;const f=()=>{const e=performance.now()-t0;if(e>dur){app.style.transform='';return;}
  const k=(1-e/dur)*p;app.style.transform=`translate(${(Math.random()*2-1)*k}px,${(Math.random()*2-1)*k}px)`;requestAnimationFrame(f);};f();}
function rel(el){const r=el.getBoundingClientRect(),g=app.getBoundingClientRect();return{x:r.left+r.width/2-g.left,y:r.top+r.height/2-g.top,w:r.width,h:r.height};}
function ftxt(el,text,color,size,dy){if(!el||!el.isConnected)return;const p=rel(el);const t=document.createElement('div');t.className='ftxt';t.textContent=text;
  t.style.left=p.x+'px';t.style.top=(p.y-(dy||10))+'px';t.style.color=color||'#fff';t.style.fontSize=(size||28)+'px';fx.appendChild(t);
  if(RM){setTimeout(()=>t.remove(),700);return;}
  t.animate([{transform:'translate(-50%,-50%) scale(.4)',opacity:0},{transform:'translate(-50%,-80%) scale(1.25)',opacity:1,offset:.2},{transform:'translate(-50%,-160%) scale(1)',opacity:0}],{duration:900,easing:'cubic-bezier(.2,.8,.3,1)'});
  setTimeout(()=>t.remove(),900);}
function burst(el,colors,n,up){if(RM||!el||!el.isConnected)return;const p=rel(el);for(let i=0;i<(n||14);i++){const q=document.createElement('div');q.className='part';
  q.style.background=rnd(colors);q.style.left=p.x+'px';q.style.top=p.y+'px';fx.appendChild(q);const a=up?R(-Math.PI*.85,-Math.PI*.15):Math.random()*Math.PI*2,d=R(30,80);
  q.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+(up?0:24)}px)`,opacity:0}],{duration:R(450,800),easing:'cubic-bezier(.1,.8,.3,1)'});
  setTimeout(()=>q.remove(),850);}}
function steam(el,n){if(RM||!el)return;const p=rel(el);for(let i=0;i<(n||10);i++){setTimeout(()=>{const q=document.createElement('div');q.className='part';q.style.background='rgba(255,255,255,.85)';
  q.style.width=q.style.height=(Math.random()<.5?6:9)+'px';q.style.left=(p.x+R(-20,20))+'px';q.style.top=(p.y-6)+'px';fx.appendChild(q);
  q.animate([{transform:'translate(0,0)',opacity:.9},{transform:`translate(${R(-14,14)}px,-60px)`,opacity:0}],{duration:800,easing:'ease-out'});setTimeout(()=>q.remove(),820);},i*60);}}
function anim(el,cls){if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);}
function flyTo(fromEl,toEl,src,size){return new Promise(done=>{if(RM||!fromEl||!toEl){done();return;}const a=rel(fromEl),b=rel(toEl);const im=document.createElement('img');im.src=src;im.className='px';const s=size||48;
  im.style.cssText=`position:absolute;width:${s}px;height:${s}px;left:${a.x-s/2}px;top:${a.y-s/2}px;z-index:60`;fx.appendChild(im);
  im.animate([{transform:'translate(0,0) scale(1) rotate(0)'},{transform:`translate(${(b.x-a.x)/2}px,${(b.y-a.y)/2-70}px) scale(1.25) rotate(-16deg)`},{transform:`translate(${b.x-a.x}px,${b.y-a.y}px) scale(1) rotate(0)`}],{duration:420,easing:'ease-in-out'});
  setTimeout(()=>{im.remove();done();},410);});}
function countTo(el,from,to){if(!el)return;if(RM||from===to){el.textContent=to;return;}const t0=performance.now(),dur=350;const f=()=>{const k=Math.min(1,(performance.now()-t0)/dur);el.textContent=Math.round(from+(to-from)*k);if(k<1)requestAnimationFrame(f);};f();}
function flash(op,dur){const f=$('#flash');if(RM)return;f.animate([{opacity:op},{opacity:0}],{duration:dur||500,easing:'ease-out'});}

/* ================= DOOR ================= */
function renderDoor(){
  const word=(w,off)=>`<div class="mword">${w.split('').map((ch,i)=>`<span class="mletter" style="--c:${['#E5352B','#FFC93C','#27C46B','#2F7CF6','#C77DFF','#FF7A1A'][(i+off)%6]};--r:${(((i*37+off*11)%13)-6)}deg">${ch}</span>`).join('')}</div>`;
  $('#mlogo').innerHTML=word('MIDNIGHT',0)+word('PANTRY',3);
  $('#parade').innerHTML=['ziemniak','cebula','jajko','burak','chili','kielbasa'].map((k,i)=>`<img class="px" src="${IMG[k][i%3]}" alt="" style="animation-delay:${i*.15}s">`).join('');
  $('#sticky').innerHTML=`Babcia w sanatorium. Nocą z zamrażalnika wyłazi pleśń. Pilnujcie lodówki!<br>Najdalej: <b>noc ${meta.best}/10</b> · Dania ★★★: <b>${meta.dishes.length}/12</b>`;
  $('#dishmags').innerHTML=meta.dishes.map(k=>`<img class="px" src="${IMG[k][2]}" alt="">`).join('');}
function doorTitle(show){$('#doorTitle').style.display=show?'contents':'none';}
async function doorOpen(){SFX.creak();flash(.5,600);door.hidden=false;
  if(!RM)await door.animate([{transform:'rotateY(0deg)',opacity:1},{transform:'rotateY(-104deg)',opacity:.9,offset:.85},{transform:'rotateY(-112deg)',opacity:0}],{duration:650,easing:'cubic-bezier(.5,0,.3,1)'}).finished;
  door.hidden=true;}
async function doorClose(){door.hidden=false;
  if(!RM)await door.animate([{transform:'rotateY(-112deg)',opacity:0},{transform:'rotateY(-100deg)',opacity:1,offset:.15},{transform:'rotateY(0deg)',opacity:1}],{duration:520,easing:'cubic-bezier(.6,0,.9,.6)'}).finished;
  SFX.thud();shake(8);}
async function doorFade(){if(!RM)await door.animate([{opacity:1},{opacity:0}],{duration:450,easing:'ease-in'}).finished;door.hidden=true;}

/* ================= RUN ================= */
let run=null,B=null,uid=0,paused=false;
function tierPool(){return run.night>=5?3:run.night>=3?2:1;}
function stat(u){const K=KINDS[u.k];return{a:K.a*u.t+u.ba,h:K.h*u.t+u.bh};}
function newRun(){run={night:1,hp:MAXHP,coins:10,team:Array(SLOTS).fill(null),shop:[],sel:null,phase:'shop',speed:1,won:0,newDishes:[],clock:8*60};rollShop();}
function rollShop(){const mt=tierPool();const pool=Object.keys(KINDS).filter(k=>KINDS[k].r<=mt);
  const owned=run.team.filter(u=>u&&u.t<3).map(u=>u.k);const n=run.night>=5?4:3;
  run.shop=Array.from({length:n},()=>({k:owned.length&&Math.random()<.4?rnd(owned):rnd(pool)}));}
function owner(k){return run.team.findIndex(u=>u&&u.k===k);}
function mkEnemy(k){const d=ENEMIES[k],n=run.night;const h=d.h+(d.boss?0:n-1),a=d.a+(d.boss?0:Math.floor((n-1)/3));return Object.assign({},d,{k,uid:++uid,a,h,max:h,clash:0});}
function unitName(u){return u.tok?TOKENS[u.k].n:KINDS[u.k].n[u.t-1];}
function unitImg(u){return u.tok?IMG[u.k][0]:IMG[u.k][u.t-1];}

/* ================= RENDER ================= */
function setClock(min){run.clock=min;const h=Math.floor(min/60)%24,m=min%60;$('#clock').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;}
function renderHUD(){
  $('#jarFill').style.height=(run.hp/MAXHP*100)+'%';$('#jarN').textContent=`${run.hp}/${MAXHP}`;
  $('#calN').textContent=run.night;
  $('#coins').innerHTML=`<img class="px" src="${COIN}" alt=""><span id="coinN">${run.coins}</span>`;
  $('#muteBtn').textContent=muted?'×':'♪';}
function badges(a,h){return `<div class="badges"><span class="bdg a">${a}</span><span class="bdg h">${Math.max(0,h)}</span></div>`;}
function renderEnemies(hiddenIn){const list=run.phase==='fight'?B.enemies:(run.preview||(run.preview=WAVES[run.night-1].map(mkEnemy)));
  $('#eCount').textContent=run.phase==='fight'?`${list.length} w kolejce`:`dziś w nocy: ${list.length}`;
  $('#eRow').innerHTML=list.map((e,i)=>`<div class="unit enemy ${e.boss?'boss':''} ${i===0?'front':''}" id="e-${e.uid}" data-act="enemy" data-i="${i}" ${hiddenIn?'style="opacity:0"':''}><img class="px sp" src="${MON[e.k]}" alt="${e.n}">${badges(e.a,e.h)}</div>`).join('');}
function renderTeam(){const fight=run.phase==='fight';const list=fight?B.allies:run.team;
  const front=list.findIndex(u=>u&&(!fight||u.h>0));
  $('#tRow').innerHTML=list.map((u,i)=>{const s=run.sel;
    if(!u)return `<div class="unit empty" id="t-${i}" data-act="slot" data-i="${i}"></div>`;
    const cls=['unit'];if(i===front)cls.push('front');
    if(!fight&&s&&s.type==='shelf'){if(s.i===i)cls.push('sel');else cls.push('swapok');}
    if(fight&&u.h<=0)cls.push('dead');
    const st=fight?{a:u.a,h:u.h}:stat(u);
    const pips=!fight&&!u.tok&&u.t<3?`<div class="pips">${[0,1,2].map(j=>`<i class="${j<u.c?'on':''}"></i>`).join('')}</div>`:'<div class="pips"></div>';
    return `<div class="${cls.join(' ')}" id="t-${i}" data-act="slot" data-i="${i}"><div class="stars">${u.tok?'':STARS[u.t-1]}</div><img class="px sp" src="${unitImg(u)}" alt="${unitName(u)}">${badges(st.a,st.h)}${pips}</div>`;}).join('');}
function renderShop(){const el=$('#shop');
  if(run.phase!=='shop'){el.innerHTML='';el.style.visibility='hidden';$('#clabel').textContent='NOC';return;}el.style.visibility='';$('#clabel').textContent='ZAKUPY';
  el.innerHTML=run.shop.map((c,i)=>{if(c.sold)return `<div class="card sold"></div>`;const K=KINDS[c.k],o=owner(c.k),u=o>=0?run.team[o]:null;
    const sel=run.sel&&run.sel.type==='shop'&&run.sel.i===i;
    return `<button class="card ${sel?'sel':'wiggle'} ${run.coins<COST?'poor':''}" style="--rc:${RCOL[K.r]};animation-delay:${i*.3}s" data-act="card" data-i="${i}" aria-pressed="${sel}">
      <span class="price">${COST}</span>${u?`<span class="own">${u.t===3?'MAX':(u.c+1)+'/3'}</span>`:''}
      <img class="px sp" src="${IMG[c.k][0]}" alt=""><span class="cn">${K.n[0]}</span><span class="cs"><span class="bdg a">${K.a}</span><span class="bdg h">${K.h}</span></span></button>`;}).join('');}
function renderActions(){const el=$('#actions');
  if(run.phase==='fight'){el.innerHTML=`<button class="btn b-gray" data-act="speed">TEMPO ×${run.speed}</button>`;return;}
  if(run.phase!=='shop'){el.innerHTML='';return;}
  const s=run.sel;
  if(s&&s.type==='shop'){const c=run.shop[s.i],o=owner(c.k),u=o>=0?run.team[o]:null;const full=!u&&run.team.every(Boolean);const max=u&&u.t===3;
    el.innerHTML=`<button class="btn b-gray" data-act="cancel">ANULUJ</button><button class="btn b-green grow" data-act="buy" ${run.coins<COST||full||max?'disabled':''}>${max?'MAX ★★★':full?'PÓŁKA PEŁNA':u?'KUP · DO PATELNI':'KUP · '+COST}</button>`;return;}
  if(s&&s.type==='shelf'){const u=run.team[s.i];el.innerHTML=`<button class="btn b-gray" data-act="cancel">ANULUJ</button><button class="btn b-red grow" data-act="sell">SPRZEDAJ +${u.t}</button>`;return;}
  el.innerHTML=`<button class="btn b-blue" data-act="reroll" ${run.coins<1?'disabled':''}>NOWA DOSTAWA · 1</button><button class="btn b-orange grow wiggle" data-act="night" ${run.team.some(Boolean)?'':'disabled'}>ZAMKNIJ ▶</button>`;}
function center(title,desc){$('#center').innerHTML=`${title?`<div class="ct">${title}</div>`:''}<div class="cd">${desc||''}</div>`;}
function defaultCenter(){const n=run.night;let d;
  if(n===1)d='Kup coś na blacie i postaw na półce. <em>Pierwszy z lewej walczy pierwszy.</em>';
  else if(n===2)d='<em>3 takie same</em> lądują na patelni i robią się lepsze: ★★.';
  else if(n===3)d='Nowe składniki w dostawie! <em>Kolejne 3</em> robią z ★★ danie ★★★.';
  else if(n===5)d='Najlepsze produkty na blacie. <em>Dziś przychodzi Król Pleśni.</em>';
  else if(n===10)d='Ostatnia noc. <em>Zapomniany Słoik</em> czeka z tyłu lodówki.';
  else d='Stuknij składnik albo potwora, żeby go poznać.';
  center(`RANO · NOC ${n}`,d);}
function infoUnit(k,t,extra){const K=KINDS[k];return `${K.tr?`<span class="tag">${TRIG[K.tr]}</span>`:''}${K.ab(t)}${extra||''}`;}
function renderAll(){renderHUD();renderEnemies();renderTeam();renderShop();renderActions();}

/* ================= SHOP ACTIONS ================= */
function select(sel){run.sel=sel;SFX.tap();
  if(!sel){defaultCenter();}
  else if(sel.type==='shop'){const c=run.shop[sel.i],K=KINDS[c.k],o=owner(c.k),u=o>=0?run.team[o]:null;
    const tail=u&&u.t<3?`<br><em>Na półce masz ${u.c}/3: ${u.c===2?'ten trafi z nimi na patelnię → '+K.n[u.t]+' '+STARS[u.t]:'jeszcze '+(3-u.c)+' do '+K.n[u.t]}</em>`:`<br><em>${K.n[1]} ★★ → ${K.n[2]} ★★★</em>`;
    center(K.n[0],infoUnit(c.k,1,tail));}
  else if(sel.type==='shelf'){const u=run.team[sel.i],K=KINDS[u.k],s=stat(u);
    center(`${K.n[u.t-1]} ${STARS[u.t-1]}`,infoUnit(u.k,u.t,`<br>Atak ${s.a} · Życie ${s.h}${u.t<3?` · ${u.c}/3 do ${K.n[u.t]}`:''}. <em>Stuknij inne miejsce, żeby przestawić.</em>`));}
  renderAll();}
let busy=false;
async function cookIn(slotIdx,u){ // pan appears over the shelf slot, the pile jumps in, sizzles, flips out evolved
  const slot=document.getElementById('t-'+slotIdx);if(!slot)return;const p=rel(slot);
  const pan=document.createElement('img');pan.src=PAN;pan.className='px';pan.style.cssText=`position:absolute;width:96px;height:64px;left:${p.x-40}px;top:${p.y-96}px;z-index:61`;fx.appendChild(pan);
  if(!RM)pan.animate([{transform:'scale(.2) rotate(-20deg)',opacity:0},{transform:'scale(1) rotate(0)',opacity:1}],{duration:220,easing:'cubic-bezier(.3,1.6,.5,1)'});
  await sleep(220);
  const sp=slot.querySelector('.sp');await flyTo(sp,pan,IMG[u.k][u.t-1],48);if(sp)sp.style.visibility='hidden';
  SFX.sizzle();steam(pan,14);
  if(!RM)pan.animate([{transform:'translate(0,0)'},{transform:'translate(-3px,1px)'},{transform:'translate(3px,-1px)'},{transform:'translate(0,0)'}],{duration:120,iterations:6});
  await sleep(760);
  if(!RM)pan.animate([{transform:'rotate(0)'},{transform:'rotate(-35deg) translateY(-8px)'},{transform:'rotate(0)'}],{duration:260});
  await sleep(140);u.t++;u.c=0;renderAll();
  const el=document.getElementById('t-'+slotIdx);const nsp=el&&el.querySelector('.sp');
  if(nsp&&!RM)nsp.animate([{transform:'translateY(-90px) scale(.6) rotate(-180deg)'},{transform:'translateY(6px) scale(1.15) rotate(10deg)',offset:.75},{transform:'none'}],{duration:420,easing:'ease-out'});
  setTimeout(()=>pan.remove(),200);
  await sleep(380);anim(el,'flashk');burst(el,['#FFC93C','#FFF3B0','#FF8A1F','#C77DFF'],26,true);shake(6);SFX.merge();
  ftxt(el,STARS[u.t-1],'#FFC93C',46,44);
  center(`${KINDS[u.k].n[u.t-1].toUpperCase()}!`,infoUnit(u.k,u.t));
  if(u.t===3&&!meta.dishes.includes(u.k)){meta.dishes.push(u.k);run.newDishes.push(u.k);saveMeta();}}
async function buy(){const s=run.sel;if(busy||!s||s.type!=='shop')return;const c=run.shop[s.i];if(run.coins<COST)return;
  const o=owner(c.k);const cardEl=document.querySelector(`[data-act="card"][data-i="${s.i}"]`);
  let target=o;if(o<0){target=run.team.findIndex(u=>!u);if(target<0)return;}
  busy=true;const old=run.coins;run.coins-=COST;countTo($('#coinN'),old,run.coins);c.sold=true;run.sel=null;SFX.buy();
  if(cardEl)cardEl.style.visibility='hidden';renderActions();
  await flyTo(cardEl,document.getElementById('t-'+target),IMG[c.k][0],56);SFX.plop();
  if(o<0){run.team[target]={k:c.k,t:1,c:1,ba:0,bh:0};renderAll();const el=document.getElementById('t-'+target);anim(el,'pop');burst(el,['#fff','#BFDDE9'],8,true);defaultCenter();}
  else{const u=run.team[o];u.c++;
    if(u.c>=3&&u.t<3){renderAll();await cookIn(o,u);}
    else{renderAll();const el=document.getElementById('t-'+o);anim(el.querySelector('.sp'),'pop');ftxt(el,`${u.c}/3`,'#FFC93C',26,30);defaultCenter();}}
  busy=false;renderActions();}
function onSlot(i){if(run.phase!=='shop'||busy)return;const s=run.sel;
  if(s&&s.type==='shop'){select(null);return;}
  if(s&&s.type==='shelf'){if(s.i===i){select(null);return;}const a=run.team[s.i];run.team[s.i]=run.team[i];run.team[i]=a;run.sel=null;SFX.whoosh();renderAll();defaultCenter();anim(document.getElementById('t-'+i),'pop');return;}
  if(run.team[i])select({type:'shelf',i});}
function sell(){const s=run.sel;if(!s||s.type!=='shelf')return;const u=run.team[s.i];const el=document.getElementById('t-'+s.i);burst(el,['#F0405A','#fff'],10);
  const old=run.coins;run.coins+=u.t;run.team[s.i]=null;run.sel=null;SFX.coin();renderAll();countTo($('#coinN'),old,run.coins);defaultCenter();}

/* ================= NIGHT ================= */
const wait=ms=>new Promise(res=>{let left=ms;const tick=()=>{if(!paused)left-=40*run.speed;if(left<=0)res();else setTimeout(tick,40);};setTimeout(tick,40);});
function mkAlly(u){const s=stat(u);return{k:u.k,t:u.t,a:s.a,h:s.h,max:s.h,shell:u.k==='jajko'?u.t:0,soft:u.k==='twarog'?u.t:0,tok:false};}
function mkTok(k,t){return k==='kielek'?{k,t:1,a:t,h:t,max:t,shell:0,soft:0,tok:true}:{k,t:1,a:t,h:2*t,max:2*t,shell:0,soft:0,tok:true};}
const frontI=()=>B.allies.findIndex(a=>a&&a.h>0);
const tEl=i=>document.getElementById('t-'+i);
const eEl=e=>document.getElementById('e-'+e.uid);
function updA(i){const a=B.allies[i],el=tEl(i);if(!el||!a)return;const b=el.querySelectorAll('.bdg');if(b[0])b[0].textContent=a.a;if(b[1])b[1].textContent=Math.max(0,a.h);}
function updE(e){const el=eEl(e);if(!el)return;const b=el.querySelectorAll('.bdg');if(b[0])b[0].textContent=e.a;if(b[1])b[1].textContent=Math.max(0,e.h);}
function hitE(e,d,big){e.h-=d;const el=eEl(e);anim(el,'hurt');anim(el&&el.querySelector('.sp'),'flashk');ftxt(el,'-'+d,'#FF8A1F',big?44:34);burst(el,e.c,big?16:8);updE(e);}
function hitA(i,d){const a=B.allies[i],el=tEl(i);
  if(a.shell>0){a.shell--;ftxt(el,'BLOK!','#9FD3FF',24);SFX.block();return false;}
  d=Math.max(1,d-a.soft);a.h-=d;anim(el,'hurt');anim(el&&el.querySelector('.sp'),'flashk');ftxt(el,'-'+d,'#F0405A',34);updA(i);return true;}
function buffA(i,x,y){const a=B.allies[i];if(!a)return;a.a+=x;a.h+=y;a.max+=y;const el=tEl(i);anim(el,'act');ftxt(el,`+${x}/+${y}`,'#7CF29A',24);updA(i);}
async function clearDead(){const dead=B.enemies.filter(e=>e.h<=0);if(!dead.length)return false;let split=false;
  dead.forEach(e=>{const el=eEl(e);burst(el,e.c,22);if(el&&!RM)el.animate([{transform:'scale(1)',opacity:1},{transform:'scale(1.4,.3) translateY(20px)',opacity:0}],{duration:300,fill:'forwards'});});
  SFX.splat();await sleep(300);
  const out=[];B.enemies.forEach(e=>{if(e.h>0){out.push(e);return;}if(e.split){split=true;out.push(mkEnemy('zarodnik'),mkEnemy('zarodnik'));}});B.enemies=out;renderEnemies();return split;}
async function allyDeaths(){let msg='';const dying=[];
  B.allies.forEach((a,i)=>{if(!a||a.h>0||a.gone)return;a.gone=true;B.lost=true;dying.push(i);});
  if(!dying.length)return '';
  SFX.die();dying.forEach(i=>{const sp=tEl(i)&&tEl(i).querySelector('.sp');if(sp&&!RM)sp.animate([{filter:'none',transform:'none'},{filter:'sepia(1) hue-rotate(50deg) saturate(2) brightness(.7)',transform:'rotate(-8deg)',offset:.4},{filter:'sepia(1) hue-rotate(50deg) brightness(.5)',transform:'translateY(30px) rotate(40deg)',opacity:.2}],{duration:600,fill:'forwards'});});
  await sleep(600);
  dying.forEach(i=>{const a=B.allies[i];
    if(!a.tok&&KINDS[a.k].tr==='faint'){const tk=a.k==='ziemniak'?'kielek':'suchar';B.allies[i]=mkTok(tk,a.t);msg=`${KINDS[a.k].n[a.t-1]} się psuje… i zostawia ${TOKENS[tk].n}!`;}
    else msg=`${aName(a)} pleśnieje i spada z półki.`;});
  renderTeam();return msg;}
function aName(a){return a.tok?TOKENS[a.k].n:KINDS[a.k].n[a.t-1];}
function setNight(on){game.classList.toggle('night',on);humOn(on);}
async function bossBanner(e){const b=$('#banner');b.innerHTML=`${e.n.toUpperCase()}<small>${e.ab.replace('BOSS. ','')}</small>`;b.hidden=false;SFX.boss();shake(10);flash(.25,300);
  if(!RM)await b.animate([{transform:'translateX(-110%) skewX(-10deg)'},{transform:'translateX(0) skewX(0)',offset:.25},{transform:'translateX(0)',offset:.8},{transform:'translateX(110%) skewX(10deg)'}],{duration:2000,easing:'ease-in-out'}).finished;else await sleep(1200);
  b.hidden=true;}
async function startNight(){if(busy)return;busy=true;run.phase='closing';run.sel=null;renderActions();
  doorTitle(false);renderDoor();await doorClose();
  run.phase='fight';B={allies:run.team.map(u=>u?mkAlly(u):null),enemies:WAVES[run.night-1].map(mkEnemy),lost:false};
  setNight(true);setClock(23*60);renderHUD();renderTeam();renderEnemies(true);renderShop();renderActions();center(`NOC ${run.night}`,'Ciemno. Coś drapie w zamrażalniku…');
  await sleep(500);await doorFade();busy=false;
  for(const e of B.enemies){const el=eEl(e);if(!el)continue;SFX.ice();burst(el,['#FFFFFF','#BFDDE9','#8FD3F0'],10);
    if(!RM)el.animate([{transform:'translateY(-30px) scale(.5)',opacity:0},{transform:'translateY(4px) scale(1.1)',opacity:1,offset:.7},{transform:'none',opacity:1}],{duration:380,easing:'ease-out',fill:'forwards'});else el.style.opacity=1;
    await sleep(220);}
  B.enemies.forEach(e=>{const el=eEl(e);if(el)el.style.opacity=1;});
  await wait(400);
  const boss=B.enemies.find(e=>e.boss);if(boss)await bossBanner(boss);
  for(let i=0;i<SLOTS;i++){const a=B.allies[i];if(!a||KINDS[a.k].tr!=='start')continue;const el=tEl(i);anim(el,'act');
    if(a.k==='cebula'){center('ŁZY!',`<span class="tag">START NOCY</span>${aName(a)}: ${a.t} obrażeń każdemu potworowi.`);B.enemies.forEach(e=>hitE(e,a.t));SFX.hit();shake(4);}
    if(a.k==='czosnek'){const e=B.enemies[0];if(e){center('CZOSNEK!',`<span class="tag">START NOCY</span>${aName(a)}: ${3*a.t} obrażeń dla ${e.n}.`);hitE(e,3*a.t,true);SFX.hit();shake(5);}}
    if(a.k==='maslo'){center('MASŁO!',`<span class="tag">START NOCY</span>Sąsiedzi ${aName(a)} +${a.t}/+${a.t}.`);[i-1,i+1].forEach(j=>{if(B.allies[j])buffA(j,a.t,a.t);});SFX.heal();}
    await wait(900);if(await clearDead()){center('PĘKA!','Biała pleśń dzieli się na Zarodniki.');await wait(600);}}
  let n=0;while(frontI()>=0&&B.enemies.length&&n<80){n++;await clash(n);}
  endNight(B.enemies.length===0);}
async function clash(n){const i=frontI(),a=B.allies[i],e=B.enemies[0];
  renderTeam();renderEnemies();setClock(Math.min(23*60+n*20,29*60+40));
  $('#center').innerHTML=`<div class="clash"><span class="n a">${a.a}</span><span class="vs">STARCIE ${n}</span><span class="n e">${e.a}</span></div><div class="cd">${aName(a)} kontra ${e.n}</div>`;
  await wait(380);
  anim(tEl(i),'lungeU');anim(eEl(e),'lungeD');SFX.whoosh();
  await wait(140);
  const big=a.a>=8;hitE(e,a.a,big);SFX.hit();shake(big?9:4);
  let extra='';
  if(a.k==='chili'&&!a.tok&&B.enemies[1]){hitE(B.enemies[1],a.a);extra='Ostre! Obrywa też następny.';}
  const landed=hitA(i,e.a);if(landed)SFX.hurt();
  if(landed&&e.sour&&a.h>0&&a.a>1){a.a--;updA(i);ftxt(tEl(i),'-1 ATK','#C7A3F0',22,40);extra+=' Skwaszony: −1 ataku.';}
  if(extra)$('#center .cd').innerHTML=`${aName(a)} kontra ${e.n}<br><em>${extra.trim()}</em>`;
  await wait(650);
  const sp=await clearDead();const am=await allyDeaths();
  if(sp||am){center('',[sp?'Biała pleśń pęka na dwa Zarodniki!':'',am].filter(Boolean).join(' '));await wait(700);}
  const f=frontI(),bi=B.allies.findIndex(x=>x&&x.h>0&&x.k==='burak'&&!x.tok);
  if(bi>=0&&f>=0){const fa=B.allies[f];if(fa.h<fa.max){const h=Math.min(2*B.allies[bi].t,fa.max-fa.h);fa.h+=h;updA(f);anim(tEl(bi),'act');ftxt(tEl(f),'+'+h,'#7CF29A',30);SFX.heal();
    center('BARSZCZ LECZY',`<span class="tag">PO STARCIU</span>${aName(fa)} +${h} życia.`);await wait(700);}}
  const boss=B.enemies.find(x=>x.boss);
  if(boss){boss.clash++;
    if(boss.k==='krol'&&boss.clash%3===0){B.enemies.push(mkEnemy('zarodnik'));renderEnemies();anim(eEl(boss),'act');center('KRÓL PLEŚNI','Na koniec kolejki dochodzi Zarodnik.');await wait(800);}
    if(boss.k==='sloik'&&boss.clash%2===0&&frontI()>=0){anim(eEl(boss),'act');center('SMRÓD!','Słoik się otwiera: 1 obrażenie dla wszystkich.');shake(5);
      B.allies.forEach((x,j)=>{if(x&&x.h>0)hitA(j,1);});await wait(700);const m=await allyDeaths();if(m){center('',m);await wait(600);}}}}
async function endNight(win){const n=run.night;let lost=0;
  if(!win){lost=WAVES[n-1].some(k=>ENEMIES[k].boss)?2:1;run.hp=Math.max(0,run.hp-lost);}
  let ferm=0;run.team.forEach(u=>{if(u&&u.k==='ogorek'){u.ba+=u.t;u.bh+=u.t;ferm=Math.max(ferm,u.t);}});
  if(win)run.won++;meta.best=Math.max(meta.best,win?n:n-1);saveMeta();
  (win?SFX.win:SFX.lose)();if(!win)shake(12);renderHUD();
  center(win?'CISZA.':'PLEŚŃ WYGRAŁA',win?'Ostatni potwór znika w szczelinie zamrażalnika.':`Zakwas traci ${lost} ♥.`);
  await sleep(1100);
  // dawn: clock runs to 06:00, the door shuts, then swings open on the morning light
  const t0=run.clock;for(let k=1;k<=8;k++){setClock(Math.round(t0+(30*60-t0)*k/8));SFX.tick();await sleep(60);}
  run.phase='morning';renderActions();
  if(run.hp<=0||(win&&n===10)){gameOver(win);return;}
  doorTitle(false);renderDoor();await doorClose();await sleep(250);
  setNight(false);run.phase='shop';B=null;setClock(8*60);run.night++;run.preview=null;rollShop();run.sel=null;renderAll();center('DZIEŃ DOBRY!','Lodówka znowu świeci.');
  await doorOpen();
  receipt(win,lost,ferm);}
function receipt(win,lost,ferm){const rows=[['Dniówka',7]];if(win)rows.push(['Przetrwana noc',2]);
  const total=rows.reduce((s,r)=>s+r[1],0);run.pending=total;const nn=run.night-1;
  const tip=run.night===5?'Dziś w nocy: KRÓL PLEŚNI':run.night===3?'W dostawie nowe, niebieskie produkty':run.night===5?'':run.night===10?'Ostatnia noc. Babcia wraca jutro!':'Dziękujemy, zapraszamy jutro';
  overlay(`<div class="receipt">
    <div class="rh">SKLEP „U BABCI”<small>PARAGON · NOC ${nn} · 06:00</small></div><div class="dash"></div>
    ${rows.map(r=>`<div class="rr"><span>${r[0]}</span><b>+${r[1]}</b></div>`).join('')}
    ${!win?`<div class="rr bad"><span>Zakwas oberwał</span><b>−${lost} ♥</b></div>`:''}
    ${ferm?`<div class="rr"><span>Ogórki ukiszone</span><b>+${ferm}/+${ferm}</b></div>`:''}
    <div class="dash"></div><div class="tot"><span>RAZEM</span><span>+${total}</span></div><div class="bar"></div><div class="note">${tip}</div>
    <button class="btn b-orange" data-act="next">ZGARNIJ +${total} ▶</button></div>`,'bottom');
  const sheet=$('#overlay .receipt');if(!RM)sheet.animate([{transform:'translateY(105%)'},{transform:'translateY(0)'}],{duration:500,easing:'cubic-bezier(.2,.9,.3,1)'});
  const tr=[...document.querySelectorAll('.receipt .rr')];tr.forEach((r,i)=>setTimeout(()=>{r.classList.add('in');SFX.tick();SFX.coin(i);},450+i*280));}
async function collect(){const sheet=$('#overlay .receipt');if(sheet&&!RM)await sheet.animate([{transform:'none'},{transform:'translateY(110%)'}],{duration:280,easing:'ease-in'}).finished;
  closeOverlay();const old=run.coins;run.coins+=run.pending;run.pending=0;renderHUD();countTo($('#coinN'),old,run.coins);SFX.coin(3);
  burst($('#coins'),['#FFC93C','#FFF3B0'],12,true);defaultCenter();
  if(run.night===2&&!RM){}}
async function gameOver(win){meta.runs++;if(win)meta.won++;saveMeta();humOff();
  const nd=run.newDishes.map(k=>`<div><img class="px" src="${IMG[k][2]}" alt="">${KINDS[k].n[2]}</div>`).join('');
  overlay(`<div class="sheet"><h2>${win?'BABCIA WRÓCIŁA!':'ZAKWAS OPADŁ'}</h2><p>${win?'Kuchnia przetrwała 10 nocy. Pleśń nie miała szans.':'Rano wszystko wraca na półki. Przetrwane noce: '+run.won+'.'}</p>
    ${nd?`<p>Nowe magnesy na lodówkę:</p><div class="coll">${nd}</div>`:''}<p style="color:var(--muted)">Najlepszy wynik: noc ${meta.best}</p>
    <button class="btn b-orange" data-act="home">ZAMKNIJ LODÓWKĘ</button></div>`,'mid');}
async function goHome(){closeOverlay();renderDoor();doorTitle(true);await doorClose();setNight(false);humOff();run=null;B=null;game.hidden=true;}

/* ================= OVERLAYS ================= */
function overlay(html,mode){const o=$('#overlay');o.className=mode==='mid'?'mid':'';o.innerHTML=html;o.hidden=false;paused=true;}
function closeOverlay(){$('#overlay').hidden=true;paused=false;}
function showHelp(){overlay(`<div class="sheet"><h2>JAK GRAĆ</h2><ol class="howto">
  <li><b>Rano zakupy.</b> Stuknij produkt na blacie, potem KUP (3 monety). ANULUJ albo drugie stuknięcie odznacza.</li>
  <li><b>3 takie same lądują na patelni</b> i wychodzą lepsze: Ziemniak ★ → Frytki ★★ → Placki ★★★.</li>
  <li><b>Zamknij lodówkę</b> i patrz: pierwszy z lewej na półce bije się z pierwszym potworem z zamrażalnika.</li>
  <li><b>Kolor ramki</b> to rzadkość: szary od nocy 1, niebieski od 3, fioletowy od 5.</li>
  <li><b>Przegrana noc</b> spuszcza powietrze z Zakwasu. Przetrwaj 10 nocy do powrotu Babci.</li></ol>
  <button class="btn b-orange" data-act="close">ROZUMIEM</button></div>`,'mid');}
function showColl(){overlay(`<div class="sheet"><h2>KSIĄŻKA KUCHARSKA</h2><p>Dania ★★★ ugotowane we wszystkich nocach: ${meta.dishes.length}/12. Każde wisi potem na drzwiach jako magnes.</p>
  <div class="coll">${Object.keys(KINDS).map(k=>{const on=meta.dishes.includes(k);return `<div class="${on?'':'lock'}"><img class="px" src="${IMG[k][2]}" alt="">${on?KINDS[k].n[2]:'???'}</div>`;}).join('')}</div>
  <button class="btn b-orange" data-act="close">ZAMKNIJ</button></div>`,'mid');}

/* ================= INPUT ================= */
document.addEventListener('click',async ev=>{const t=ev.target.closest('[data-act]');if(!t)return;ac();const act=t.dataset.act,i=+t.dataset.i;
  switch(act){
    case 'play':{if(busy)break;busy=true;SFX.buy();newRun();game.hidden=false;setClock(8*60);renderAll();defaultCenter();humOn(false);await doorOpen();busy=false;break;}
    case 'help':SFX.tap();showHelp();break;
    case 'coll':SFX.tap();showColl();break;
    case 'close':SFX.tap();closeOverlay();break;
    case 'mute':muted=!muted;if(muted)humOff();else humOn(game.classList.contains('night'));renderHUD();break;
    case 'card':if(!run||run.phase!=='shop'||busy||run.shop[i].sold)break;if(run.sel&&run.sel.type==='shop'&&run.sel.i===i)select(null);else select({type:'shop',i});break;
    case 'buy':buy();break;
    case 'cancel':select(null);break;
    case 'slot':onSlot(i);break;
    case 'sell':sell();break;
    case 'enemy':{if(!run)break;const e=(run.phase==='fight'?B.enemies:run.preview)[i];if(e){SFX.tap();center(e.n,`Atak ${e.a} · Życie ${Math.max(0,e.h)}. ${e.ab}`);}break;}
    case 'reroll':if(run&&run.coins>=1&&!busy){const old=run.coins;run.coins--;rollShop();run.sel=null;SFX.whoosh();renderAll();countTo($('#coinN'),old,run.coins);
      document.querySelectorAll('.card').forEach((c,j)=>{if(!RM)c.animate([{transform:'translateX(-120%) rotate(-20deg)',opacity:0},{transform:'none',opacity:1}],{duration:300,delay:j*70,easing:'cubic-bezier(.3,1.4,.5,1)',fill:'backwards'});});defaultCenter();}break;
    case 'night':if(run&&run.team.some(Boolean))startNight();break;
    case 'speed':run.speed=run.speed===1?2:run.speed===2?3:1;renderActions();break;
    case 'next':collect();break;
    case 'home':goHome();break;
  }});
renderDoor();
})();
</script>
