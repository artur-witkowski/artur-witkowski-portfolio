<title>Midnight Pantry</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: one phone-tall column. Hub = closed fridge door with magnets; game = open fridge (freezer on top, 5 shelves), thumb panel at the bottom. Single deliberate look: dark kitchen at midnight, lit fridge. */
:root{
  --night:#1C1924; --night-2:#2A2534; --night-3:#3A3346;
  --enamel:#F4E9DA; --enamel-shade:#E2D2BC; --chrome-hi:#ECE8E2; --chrome-lo:#9C968C;
  --cold-hi:#F4FBFC; --cold-lo:#CDE6EB; --glass:rgba(132,190,204,.55);
  --ink:#33241C; --ink-soft:#7A6656; --paper:#FFF8E8; --moon:#E9DCCB;
  --tomato:#D65F45; --mustard:#E8B54A; --teal:#3E8A86; --leaf:#4F8A3E;
  --atk-bg:#F7D5C9; --atk-fg:#9B3320; --hp-bg:#D6EACB; --hp-fg:#2F6A23;
  --f-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-hand:'Caveat','Bradley Hand','Segoe Print',cursive;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(120% 60% at 15% 0%,#2B2740 0%,var(--night) 60%);color:var(--paper);font-family:var(--f-display);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,[data-act]:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
#app{position:relative;height:100%;max-width:460px;margin:0 auto;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}

/* ---------- HUB: closed fridge door ---------- */
.door{flex:1;min-height:0;position:relative;color:var(--ink);background:linear-gradient(90deg,var(--enamel) 0 90%,var(--enamel-shade));border-radius:28px 28px 18px 18px;box-shadow:0 30px 70px rgba(0,0,0,.5),inset 0 -8px 0 var(--enamel-shade);display:flex;flex-direction:column;gap:14px;padding:18px 40px 18px 18px;transform-origin:left center;transition:transform .55s cubic-bezier(.6,.05,.4,1),opacity .55s;overflow:hidden}
.door.opening{transform:perspective(1100px) rotateY(-96deg);opacity:.2}
.freezer-door{display:flex;flex-direction:column;gap:2px;padding-bottom:16px;border-bottom:4px solid var(--enamel-shade);margin-right:-40px;padding-right:40px}
.badge{align-self:flex-start;font-size:10px;font-weight:800;letter-spacing:.24em;padding:3px 8px;border-radius:4px;color:#5d5850;background:linear-gradient(180deg,var(--chrome-hi),var(--chrome-lo));box-shadow:inset 0 1px 0 #fff}
.wordmark{font-size:clamp(30px,8.5vw,40px);font-weight:800;line-height:.95;letter-spacing:-.02em;margin-top:8px;text-wrap:balance}
.wordmark small{display:block;font-family:var(--f-hand);font-weight:700;font-size:.62em;color:var(--tomato);letter-spacing:0;margin-top:2px}
.handle{position:absolute;right:12px;width:11px;border-radius:7px;background:linear-gradient(90deg,var(--chrome-hi),var(--chrome-lo));box-shadow:2px 3px 6px rgba(0,0,0,.2)}
.handle.top{top:28px;height:56px}.handle.main{top:34%;height:130px}
.magnets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.magnet{border-radius:10px;padding:6px 2px 5px;text-align:center;background:var(--mc);transform:rotate(var(--r));box-shadow:0 3px 0 rgba(0,0,0,.14),0 6px 10px rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.magnet .me{font-size:20px;line-height:1.1}
.magnet .mt{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.magnet.locked{background:transparent;box-shadow:none;border:2px dashed #CFC1AE;color:#B4A591}
.magnet.locked .me{opacity:.35}
.note{position:relative;background:#FFFDF4;font-family:var(--f-hand);font-size:clamp(19px,5.4vw,23px);line-height:1.12;padding:16px 14px 12px;transform:rotate(-1.4deg);box-shadow:0 8px 16px rgba(0,0,0,.14);color:#3B2C25}
.note::before{content:"";position:absolute;top:-8px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a85,var(--tomato) 60%,#9c3a28);box-shadow:0 2px 3px rgba(0,0,0,.3)}
.note .sig{display:block;text-align:right;color:var(--tomato)}
.hubstats{font-size:13px;color:var(--ink-soft);display:flex;gap:12px;flex-wrap:wrap;margin-top:auto}
.hubstats b{color:var(--ink);font-variant-numeric:tabular-nums}
.hubrow{display:flex;gap:8px}.hubrow .btn{flex:1}
.btn{border-radius:14px;padding:12px 14px;font-weight:800;font-size:15px;line-height:1.1;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--tomato);color:#fff;box-shadow:0 4px 0 #9c3a28}
.btn.ghost{background:var(--night-3);color:var(--paper)}
.btn.light{background:#EADCC8;color:var(--ink)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.big{font-size:17px;padding:15px}

/* ---------- GAME ---------- */
.hud{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px}
.chip{background:var(--night-2);border-radius:999px;padding:6px 10px;display:flex;gap:5px;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.hp{color:#FFB4A3;letter-spacing:1px}.chip.crumbs{color:#F5CF7E}
.hud .sp{flex:1}
.iconbtn{width:34px;height:34px;border-radius:50%;background:var(--night-2);display:grid;place-items:center;font-size:16px;font-weight:800}
.fridge{flex:1;min-height:0;background:var(--enamel);border-radius:22px 22px 14px 14px;padding:9px;display:flex;flex-direction:column;gap:7px;box-shadow:inset 0 -6px 0 var(--enamel-shade),0 0 70px rgba(255,232,170,.16)}
.freezer{flex:0 0 auto;height:clamp(96px,15.5vh,124px);border-radius:12px;position:relative;overflow:hidden;background:radial-gradient(circle at 12% 20%,#fff 0 3px,transparent 4px),radial-gradient(circle at 80% 70%,#fff 0 2px,transparent 3px),radial-gradient(circle at 55% 15%,#fff 0 2px,transparent 3px),linear-gradient(180deg,var(--cold-hi),var(--cold-lo));box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),inset 0 8px 16px rgba(110,165,180,.35)}
.flabel{position:absolute;top:6px;left:10px;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#5C8C97}
.queue{position:absolute;left:0;right:0;bottom:0;top:18px;display:flex;align-items:flex-end;gap:8px;padding:0 10px 8px;overflow-x:auto;scrollbar-width:none}
.queue::-webkit-scrollbar{display:none}
.interior{flex:1;min-height:0;position:relative;border-radius:12px;display:grid;grid-template-columns:minmax(0,1fr) 34px;grid-template-rows:repeat(5,minmax(0,1fr));column-gap:3px;padding:2px 4px 4px 6px;background:radial-gradient(70% 40% at 50% 0%,#FFFDF0 0%,rgba(255,253,240,0) 100%),linear-gradient(180deg,#FBF4E3,#EBE0C8);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.interior.lit{animation:lightOn .7s steps(1) 1}
@keyframes lightOn{0%{filter:brightness(.4)}15%{filter:brightness(1)}25%{filter:brightness(.6)}40%,100%{filter:brightness(1)}}
.shelf{grid-column:1;position:relative;display:flex;align-items:center;gap:10px;padding:0 8px;min-height:0;border-bottom:5px solid var(--glass);border-radius:6px 6px 3px 3px;color:var(--ink);transition:background .15s,opacity .2s}
.shelf.valid{background:rgba(62,138,134,.13);box-shadow:inset 0 0 0 2px rgba(62,138,134,.55)}
.shelf.sel{background:rgba(232,181,74,.22);box-shadow:inset 0 0 0 2px var(--mustard)}
.shelf .emptytxt{font-size:12px;color:#B9AA95;font-style:italic}
.interior.fight .shelf{opacity:.62}
.interior.fight .shelf.fighting{opacity:1;background:rgba(214,95,69,.1);box-shadow:inset 0 0 0 2px rgba(214,95,69,.45)}
.interior.fight .shelf.acting{opacity:1;background:rgba(232,181,74,.25)}
.food{font-size:clamp(26px,5vh,40px);line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.12));flex:0 0 auto;display:inline-block}
.meta{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.name{font-weight:800;font-size:14px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:4px;align-items:center}
.pill{font-size:12px;font-weight:800;padding:2px 7px;border-radius:999px;font-variant-numeric:tabular-nums;line-height:1.2}
.pill.atk{background:var(--atk-bg);color:var(--atk-fg)}.pill.hp{background:var(--hp-bg);color:var(--hp-fg)}
.lvl{font-size:11px;font-weight:800;color:#B07F12;margin-left:2px;white-space:nowrap}
.frontflag{position:absolute;right:6px;top:4px;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--tomato)}
.shelf.dead .food{filter:grayscale(1);opacity:.35;transform:rotate(-24deg)}
.shelf.dead .name{text-decoration:line-through;opacity:.5}
.shelf.dead .stats{opacity:.3}
.bracket{grid-column:2;position:relative;margin:12px 0 12px 0;border:3px solid var(--mustard);border-left:none;border-radius:0 12px 12px 0;cursor:pointer;transition:box-shadow .2s}
.bracket .dish{position:absolute;top:50%;right:-4px;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:var(--mustard);display:grid;place-items:center;font-size:15px;box-shadow:0 2px 0 #b98a2c}
.bracket.cook{box-shadow:6px 0 18px rgba(232,181,74,.8)}
.bracket.cook .dish{animation:pulseK .6s}

/* enemies */
.enemy{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative;opacity:.75}
.enemy.front{opacity:1}
.enemy .body{position:relative;width:36px;height:30px;display:grid;place-items:center}
.enemy.front .body{width:50px;height:42px}
.enemy.small .body{width:26px;height:22px}
.enemy.boss .body{width:66px;height:56px}
.enemy .ep{display:flex;gap:2px}
.enemy .ep b{font-size:10px;font-weight:800;padding:0 4px;border-radius:6px;font-variant-numeric:tabular-nums}
.enemy .ep .a{background:var(--atk-bg);color:var(--atk-fg)}.enemy .ep .h{background:var(--hp-bg);color:var(--hp-fg)}
.eyes{position:absolute;top:30%;left:50%;transform:translateX(-50%);display:flex;gap:18%;width:56%;justify-content:center}
.eyes i{width:26%;aspect-ratio:1/1.1;background:#fff;border-radius:50%;position:relative;max-width:11px}
.eyes i::after{content:"";position:absolute;width:48%;height:48%;background:#2a2320;border-radius:50%;left:30%;top:38%}
.mold .body{border-radius:52% 48% 44% 46%/62% 58% 42% 40%;background:radial-gradient(circle at 28% 26%,rgba(255,255,255,.4) 0 14%,transparent 15%),radial-gradient(circle at 72% 70%,rgba(0,0,0,.09) 0 12%,transparent 13%),var(--c);box-shadow:0 0 5px 2px var(--c);animation:wob 2.4s ease-in-out infinite}
@keyframes wob{50%{border-radius:46% 54% 48% 44%/56% 62% 38% 44%}}
.crown{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:18px}
.cup .body{border-radius:6px 6px 14px 14px;background:linear-gradient(180deg,#fff 0 20%,var(--c) 20%);box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.cup .body::before{content:"";position:absolute;top:-4px;left:-3px;right:-3px;height:7px;border-radius:4px;background:#9C7AC2}
.jar .body{border-radius:9px 9px 14px 14px;background:linear-gradient(180deg,#A97F48 0 15%,rgba(205,232,236,.85) 15% 38%,#6C8D45 38%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)}
.jar .lbl{position:absolute;bottom:14%;left:50%;transform:translateX(-50%);background:#FFFDF4;color:#6a4b2f;font-size:9px;font-weight:800;padding:0 4px;border-radius:3px;z-index:2}
.emo .body{font-size:26px;line-height:1}.emo.small .body{font-size:18px}.emo.front .body{font-size:32px}

/* panel */
.panelwrap{position:relative;flex:0 0 auto}
.panel{background:var(--night-2);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px}
.info{min-height:34px;font-size:13px;line-height:1.3;color:var(--moon)}
.info b{color:#fff}.info em{color:#F5CF7E;font-style:normal}
.log{min-height:52px;font-size:15px;line-height:1.35;color:#fff;display:flex;align-items:center}
.log .tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:var(--night-3);color:#F5CF7E;padding:2px 6px;border-radius:6px;margin-right:6px;vertical-align:2px}
.shop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.card{position:relative;background:var(--enamel);color:var(--ink);border-radius:14px;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;transition:transform .12s,box-shadow .12s;box-shadow:0 3px 0 var(--enamel-shade)}
.card.sel{transform:translateY(-6px);box-shadow:0 0 0 3px var(--teal),0 6px 0 var(--enamel-shade)}
.card.poor{opacity:.55}
.card.sold{background:transparent;box-shadow:none;border:2px dashed var(--night-3);color:#6d6478;font-size:12px;justify-content:center;min-height:88px}
.card .cfood{font-size:30px;line-height:1.1}
.card .cname{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.card .cstats{display:flex;gap:3px}.card .cstats b{font-size:11px;padding:0 5px;border-radius:6px}
.card .cstats .a{background:var(--atk-bg);color:var(--atk-fg)}.card .cstats .h{background:var(--hp-bg);color:var(--hp-fg)}
.card .rhint{position:absolute;top:-8px;left:-4px;background:var(--teal);color:#fff;border-radius:999px;font-size:12px;padding:1px 6px}
.actions{display:flex;gap:8px;align-items:stretch}
.actions .grow{flex:1}

/* bubble, toast, fx, overlay */
#bubble{position:absolute;left:0;right:0;bottom:calc(100% + 8px);background:var(--paper);color:var(--ink);border-radius:16px;padding:12px 12px 12px 54px;font-size:14px;line-height:1.35;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:30;animation:pop .25s ease-out}
#bubble::after{content:"";position:absolute;bottom:-7px;left:26px;width:14px;height:14px;background:var(--paper);transform:rotate(45deg)}
.minifridge{position:absolute;left:12px;top:12px;width:30px;height:42px;border-radius:7px;background:var(--enamel);box-shadow:inset 0 -3px 0 var(--enamel-shade),0 0 0 2px #d8c7ae}
.minifridge::before{content:"";position:absolute;left:0;right:0;top:13px;height:2px;background:#d8c7ae}
.minifridge::after{content:"";position:absolute;right:4px;top:18px;width:3px;height:12px;border-radius:2px;background:var(--chrome-lo)}
#bubble .who{font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--tomato);display:block;margin-bottom:2px}
#bubble .bok{margin-top:8px;display:flex;justify-content:flex-end}
#bubble .bok button{background:var(--ink);color:var(--paper);border-radius:10px;padding:7px 14px;font-weight:800;font-size:13px}
#toast{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:var(--paper);color:var(--ink);font-weight:800;font-size:14px;padding:9px 14px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:35;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;animation:toastIn .25s ease-out}
#fx{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.float{position:absolute;transform:translateX(-50%);font-weight:800;font-size:20px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 6px rgba(0,0,0,.25);animation:floatUp 1s ease-out forwards;white-space:nowrap}
.float.dmg{color:#FF7A5C}.float.heal{color:#7FD36A}.float.block{color:#9FD3E0;font-size:14px}.float.buff{color:#8EE07A;font-size:17px}.float.debuff{color:#C7A3F0;font-size:14px}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,6px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-34px) scale(1)}}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
.atk-up{animation:atkUp .3s ease-out}
@keyframes atkUp{45%{transform:translateY(-12px) scale(1.15)}}
.atk-down{animation:atkDown .3s ease-out}
@keyframes atkDown{45%{transform:translateY(12px) scale(1.12)}}
.hurt{animation:hurt .3s}
@keyframes hurt{20%{transform:translateX(-4px) rotate(-4deg)}50%{transform:translateX(4px) rotate(3deg)}80%{transform:translateX(-2px)}}
.pulse{animation:pulseK .6s}
@keyframes pulseK{40%{transform:scale(1.2);filter:drop-shadow(0 0 10px #ffd86b)}}
#overlay{position:absolute;inset:0;z-index:60;background:rgba(18,15,26,.74);display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--paper);color:var(--ink);border-radius:22px;padding:20px;width:100%;max-width:400px;max-height:88%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .25s ease-out;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:26px;line-height:1.05;font-weight:800;text-wrap:balance}
.sheet .kicker{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--tomato)}
.sheet p{margin:0;font-size:15px;line-height:1.4}
.sheet .hand{font-family:var(--f-hand);font-size:23px;line-height:1.12;color:#4a382e}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:7px 0;border-bottom:1px dashed #E3D3BC}
.row b{font-variant-numeric:tabular-nums;text-align:right}
.unlock{background:#F3E7D3;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.35}
.unlock .ue{font-size:22px;letter-spacing:4px;display:block;margin-top:2px}
.recipe{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed #E3D3BC}
.recipe .re{font-size:28px;text-align:center}
.recipe .rn{font-weight:800}.recipe .ri{font-size:18px;letter-spacing:2px}.recipe .rf{font-size:13px;color:var(--ink-soft)}
.recipe.unknown{opacity:.6}
.howto{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.4}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media (max-height:640px){.freezer{height:88px}.food{font-size:24px}.name{font-size:13px}.card .cfood{font-size:24px}.note{font-size:18px}}
</style>

<div id="app">
  <section id="hub" class="screen">
    <div class="door" id="door">
      <span class="handle top"></span><span class="handle main"></span>
      <div class="freezer-door">
        <span class="badge">BIEGUN</span>
        <div class="wordmark">Midnight Pantry<small>nocna kuchnia babci</small></div>
      </div>
      <div class="magnets" id="magnets"></div>
      <div class="note" id="note"></div>
      <div class="hubstats" id="hubstats"></div>
      <div class="hubrow">
        <button class="btn light" data-act="book">📖 Przepisy</button>
        <button class="btn light" data-act="help">Jak grać?</button>
      </div>
      <button class="btn primary big" data-act="open">Otwórz lodówkę</button>
    </div>
  </section>

  <section id="game" class="screen" hidden>
    <div class="hud" id="hud"></div>
    <div class="fridge">
      <div class="freezer"><span class="flabel" id="flabel">Zamrażalnik</span><div class="queue" id="queue"></div></div>
      <div class="interior" id="interior"></div>
    </div>
    <div class="panelwrap">
      <div id="bubble" hidden><span class="minifridge"></span><span class="who">Lodówka</span><span id="btxt"></span><div class="bok"><button data-act="bubble-ok">OK</button></div></div>
      <div class="panel" id="panel"></div>
    </div>
    <div id="toast" hidden></div>
  </section>

  <div id="fx"></div>
  <div id="overlay" hidden></div>
</div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const app=$('#app'),fx=$('#fx');

/* ================= DATA =================
   Rules of thumb for v2:
   - every ability fires at ONE clearly named moment (trigger tag)
   - combat is a sequence of clashes: one front ingredient vs one front monster
   - new systems unlock night by night, never all at once */
const TRIG={start:'Start nocy',fight:'W starciu',after:'Po starciu',death:'Po zepsuciu',morning:'Rano'};
const UNITS={

/* ================= META (persistent fridge) ================= */
const KEY='midnight-pantry-v2';
let meta={magnets:[],recipes:[],best:0,runs:0,won:0,seen:{}};
try{const s=localStorage.getItem(KEY);if(s)meta=Object.assign(meta,JSON.parse(s));}catch(e){}

/* ================= RUN STATE ================= */
const MAXHP=5,INCOME=8,COST=3;
let run=null,battle=null,uid=0,hintQ=[],toastQ=[],toastBusy=false;
function level(u){return u.copies>=6?3:u.copies>=3?2:1}
function stat(u){const d=UNITS[u.id],l=level(u);return{atk:d.atk+(u.copies-1)+(l-1)+u.bonusAtk,hp:d.hp+(u.copies-1)+(l-1)+u.bonusHp}}
function tierNow(){return run.night>=5?3:run.night>=3?2:1}
function mkEnemy(k){const d=ENEMIES[k],n=run.night;const hp=d.hp+(d.boss?0:n-1),atk=d.atk+(d.boss?0:Math.floor((n-1)/3));
  return Object.assign({},d,{key:k,uid:++uid,atk,hp,max:hp,clash:0});}
function pool(){const mt=tierNow();return Object.keys(UNITS).filter(k=>!UNITS[k].token&&UNITS[k].t<=mt);}
function rollShop(teach){
  run.shop=[0,1,2].map(()=>({id:rnd(pool())}));
  if(teach){ // night 2: guarantee one card that cooks a dish with what you own
    const owned=new Set(run.shelves.filter(Boolean).map(u=>u.id));
    for(const r of RECIPES){if(r.need.length!==2)continue;const miss=r.need.filter(x=>!owned.has(x));
      if(miss.length===1&&UNITS[miss[0]].t<=tierNow()){run.shop[0]={id:miss[0]};break;}}
  }
}
function newRun(){run={night:1,hp:MAXHP,crumbs:10,shelves:[null,null,null,null,null],shop:[],sel:null,phase:'shop',speed:1,won:0,info:'',newMagnets:[],newRecipes:[],curRecipes:[]};
  run.preview=WAVES[0].map(mkEnemy);rollShop();}

function findRecipes(ids){const out=[];RECIPES.forEach(r=>{if(run.night<2)return;const L=r.need.length,key=[...r.need].sort().join();
  for(let s=0;s+L<=5;s++){const w=ids.slice(s,s+L);if(w.includes(null))continue;if([...w].sort().join()===key){out.push({r,start:s,len:L});break;}}});return out;}
function recipeHint(id){if(run.night<2)return '';const owned=new Set(run.shelves.filter(Boolean).map(u=>u.id));
  for(const r of RECIPES){if(!r.need.includes(id)||owned.has(id))continue;if(r.need.filter(x=>x!==id).every(x=>owned.has(x)))return '✨';}return '';}
function abilityText(d){return d.tr?`<span class="tag">${TRIG[d.tr]}</span>${d.ab}`:d.ab;}

/* ================= RENDER ================= */
function renderHub(){
  $('#magnets').innerHTML=MAGNETS.map(m=>{const on=meta.magnets.includes(m.id);
    return `<div class="magnet ${on?'':'locked'}" style="--mc:${m.c};--r:${m.r}deg" title="${on?m.t:m.how}"><span class="me">${on?m.e:'?'}</span><span class="mt">${on?m.t:'???'}</span></div>`;}).join('');
  const i=meta.won>0?NOTES.length-1:Math.min(meta.runs,NOTES.length-2);
  $('#note').innerHTML=`${NOTES[i]}<span class="sig">— Babcia</span>`;
  $('#hubstats').innerHTML=`<span>Najdalej: <b>noc ${meta.best}</b>/10</span><span>Przepisy: <b>${meta.recipes.length}</b>/${RECIPES.length}</span><span>Magnesy: <b>${meta.magnets.length}</b>/${MAGNETS.length}</span>`;
  $('#door').classList.remove('opening');
}
function renderHUD(){
  $('#hud').innerHTML=`<span class="chip hp" title="Zakwas: życie całej gry">🫙 ${'♥'.repeat(run.hp)}<span style="opacity:.25">${'♥'.repeat(MAXHP-run.hp)}</span></span><span class="chip">Noc ${run.night}/10</span><span class="chip crumbs" title="Okruszki">🍪 ${run.crumbs}</span><span class="sp"></span><button class="iconbtn" data-act="book" aria-label="Przepisy">📖</button><button class="iconbtn" data-act="help" aria-label="Jak grać">?</button>`;
}
function enemyHTML(e,i,front){
  const cls=['enemy',e.shape,front?'front':'',e.small?'small':'',e.boss?'boss':''].join(' ');
  let inner;
  if(e.shape==='emo')inner=e.e;
  else if(e.shape==='jar')inner=`<span class="eyes"><i></i><i></i></span><span class="lbl">2009</span>`;
  else inner=`<span class="eyes"><i></i><i></i></span>${e.crown?'<span class="crown">👑</span>':''}`;
  return `<div class="${cls}" id="en-${e.uid}" data-act="enemy" data-i="${i}" style="--c:${e.c||'#999'}"><span class="body">${inner}</span><span class="ep"><b class="a">⚔${e.atk}</b><b class="h">♥${Math.max(0,e.hp)}</b></span></div>`;
}
function enemyList(){return run.phase==='fight'?battle.enemies:run.preview;}
function renderQueue(){
  const list=enemyList();
  $('#flabel').textContent=run.phase==='fight'?'Zamrażalnik':`Dziś w nocy przyjdą:`;
  $('#queue').innerHTML=list.map((e,i)=>enemyHTML(e,i,i===0)).join('');
  list.forEach(e=>{e.el=document.getElementById('en-'+e.uid);});
}
function validTarget(i){const s=run.sel;if(!s||run.phase!=='shop')return false;
  if(s.type==='shop'){const it=run.shop[s.i];if(!it||it.sold)return false;const u=run.shelves[i];return !u||(u.id===it.id&&u.copies<6&&run.night>=3);}
  if(s.type==='shelf')return i!==s.i;return false;}
function lvlText(u){if(run.night<3)return '';const l=level(u);if(l===3)return '<span class="lvl">★★★</span>';const n=u.copies-(l===1?0:3);return `<span class="lvl">${LV[l-1]} ${n}/3</span>`;}
function renderShelves(){
  const fight=run.phase==='fight';let html='';
  const front=fight?battle.allies.findIndex(a=>a&&a.hp>0):run.shelves.findIndex(Boolean);
  for(let i=0;i<5;i++){
    const cls=['shelf'];
    if(!fight){if(run.sel&&run.sel.type==='shelf'&&run.sel.i===i)cls.push('sel');if(validTarget(i))cls.push('valid');}
    else if(i===front)cls.push('fighting');
    const flag=i===front?'<span class="frontflag">walczy</span>':'';
    const u=fight?battle.allies[i]:run.shelves[i];
    const act=fight?'':` data-act="shelf" data-i="${i}"`;
    if(!u){html+=`<div class="${cls.join(' ')}" id="shelf-${i}"${act} style="grid-row:${i+1}">${fight?'':'<span class="emptytxt">pusta półka</span>'}</div>`;continue;}
    const d=UNITS[u.id];let atk,hp,extra='';
    if(fight){atk=u.atk;hp=Math.max(0,u.hp);if(u.hp<=0)cls.push('dead');if(u.shell)extra='<span class="lvl">🥚 skorupka</span>';}
    else{const s=stat(u);atk=s.atk;hp=s.hp;extra=lvlText(u);}
    html+=`<div class="${cls.join(' ')}" id="shelf-${i}"${act} style="grid-row:${i+1}"><span class="food">${d.e}</span><span class="meta"><span class="name">${d.n}</span><span class="stats"><b class="pill atk">⚔ ${atk}</b><b class="pill hp">♥ ${hp}</b>${extra}</span></span>${flag}</div>`;
  }
  const recs=fight?battle.recipes:findRecipes(run.shelves.map(u=>u?u.id:null));
  if(!fight)run.curRecipes=recs;
  recs.forEach((x,k)=>{html+=`<div class="bracket" id="br-${k}" data-act="bracket" data-i="${k}" style="grid-row:${x.start+1} / span ${x.len}" title="${x.r.n}"><span class="dish">${x.r.e}</span></div>`;});
  const it=$('#interior');it.innerHTML=html;it.classList.toggle('fight',fight);
  if(fight)battle.allies.forEach((a,i)=>{if(a)a.el=document.getElementById('shelf-'+i);});
}
function cardHTML(it,i){
  const sel=run.sel&&run.sel.type==='shop'&&run.sel.i===i;
  if(it.sold)return `<div class="card sold">kupione</div>`;
  const d=UNITS[it.id],h=recipeHint(it.id);
  return `<button class="card ${sel?'sel':''} ${run.crumbs<COST?'poor':''}" data-act="shop" data-i="${i}">${h?`<span class="rhint">${h}</span>`:''}<span class="cfood">${d.e}</span><span class="cname">${d.n}</span><span class="cstats"><b class="a">⚔${d.atk}</b><b class="h">♥${d.hp}</b></span></button>`;
}
function defaultInfo(){return `Każdy składnik kosztuje ${COST} 🍪. <em>Stuknij kartę, potem półkę.</em> Stuknij potwora, żeby go poznać.`;}
function renderPanel(){
  const p=$('#panel');
  if(run.phase==='shop'){
    const s=run.sel;const sellU=s&&s.type==='shelf'?run.shelves[s.i]:null;const any=run.shelves.some(Boolean);
    p.innerHTML=`<div class="info" id="info">${run.info||defaultInfo()}</div>
      <div class="shop">${run.shop.map(cardHTML).join('')}</div>
      <div class="actions">
        ${sellU?`<button class="btn ghost" data-act="sell">Sprzedaj +${level(sellU)} 🍪</button>`:`<button class="btn ghost" data-act="reroll" ${run.crumbs<1?'disabled':''}>🔄 Nowe karty · 1 🍪</button>`}
        <button class="btn primary grow" data-act="night" ${any?'':'disabled'}>${any?'Zamknij drzwi ▶':'Postaw coś na półce'}</button></div>`;
  }else{
    p.innerHTML=`<div class="log" id="log"><span>${run.log||''}</span></div>
      <div class="actions"><span class="info grow" id="fightinfo" style="min-height:0;align-self:center">Noc ${run.night}. Walka idzie sama.</span><button class="btn ghost" data-act="speed">Tempo ×${run.speed}</button></div>`;
  }
}
function renderAll(){renderHUD();renderQueue();renderShelves();renderPanel();}
function info(html){run.info=html;const el=$('#info');if(el)el.innerHTML=html;}
function log(html){run.log=html;const el=$('#log');if(el)el.innerHTML=`<span>${html}</span>`;}

/* ================= FEEDBACK ================= */
function toast(html){toastQ.push(html);if(!toastBusy)nextToast();}
function nextToast(){const t=$('#toast');if(!toastQ.length){toastBusy=false;t.hidden=true;return;}toastBusy=true;t.innerHTML=toastQ.shift();t.hidden=false;
  t.style.animation='none';void t.offsetWidth;t.style.animation='';setTimeout(nextToast,1600);}
function hint(k){if(meta.seen[k]||hintQ.includes(k))return;hintQ.push(k);if($('#bubble').hidden)showHint();}
function showHint(){const b=$('#bubble');if(!hintQ.length){b.hidden=true;return;}$('#btxt').textContent=HINTS[hintQ[0]];b.hidden=false;}
function award(id){if(meta.magnets.includes(id))return;meta.magnets.push(id);saveMeta();if(run)run.newMagnets.push(id);}
function float(o,text,cls){const host=o&&o.el;if(!host||!host.isConnected)return;const el=host.querySelector('.food,.body')||host;
  const r=el.getBoundingClientRect(),g=app.getBoundingClientRect();const f=document.createElement('div');f.className='float '+(cls||'');f.textContent=text;
  f.style.left=(r.left+r.width/2-g.left)+'px';f.style.top=(r.top-g.top-4)+'px';fx.appendChild(f);setTimeout(()=>f.remove(),1050);}
function anim(o,cls){const host=o&&o.el;if(!host)return;const el=host.querySelector('.food,.body')||host;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);}

/* ================= SHOP ================= */
function afterRoster(){
  findRecipes(run.shelves.map(u=>u?u.id:null)).forEach(({r})=>{if(!meta.recipes.includes(r.id)){meta.recipes.push(r.id);saveMeta();run.newRecipes.push(r.id);
    toast(`Nowy przepis! ${r.e} ${r.n}`);award('krakow');if(meta.recipes.length>=4)award('gdansk');}});
  if(run.shelves.every(Boolean))award('hel');
  renderAll();
}
function lvlToast(u,before){const a=level(u);if(a>before){toast(`${UNITS[u.id].e} ${UNITS[u.id].n} ${LV[a-1]}!`);if(a===3)award('sopot');}}
function buyTo(si,i){const it=run.shop[si];
  if(run.crumbs<COST){info('Za mało okruszków. Sprzedaj coś albo zamknij drzwi i przetrwaj noc.');return;}
  const u=run.shelves[i];
  if(u&&u.id!==it.id){info('Ta półka jest zajęta. Wybierz pustą półkę.');return;}
  if(u&&run.night<3){info('Łączenie takich samych składników odblokuje się w nocy 3. Wybierz pustą półkę.');return;}
  if(u&&u.copies>=6){info('Ten składnik jest już ★★★.');return;}
  run.crumbs-=COST;it.sold=true;
  if(!u)run.shelves[i]={id:it.id,copies:1,bonusAtk:0,bonusHp:0};else{const b=level(u);u.copies++;lvlToast(u,b);}
  run.sel=null;run.info='';afterRoster();}
function autoTarget(id){if(run.night>=3){const same=run.shelves.findIndex(u=>u&&u.id===id&&u.copies<6);if(same>=0)return same;}return run.shelves.findIndex(u=>!u);}
function unitInfo(u){const d=UNITS[u.id],s=stat(u);const grown=u.bonusAtk||u.bonusHp?` Ukiszony: +${u.bonusAtk}/+${u.bonusHp}.`:'';
  return `${d.e} <b>${d.n}</b> ⚔ ${s.atk} ♥ ${s.hp}. ${abilityText(d)}${grown} <em>Stuknij inną półkę, żeby przestawić.</em>`;}
function onShop(i){const it=run.shop[i];if(!it||it.sold)return;
  if(run.sel&&run.sel.type==='shop'&&run.sel.i===i){run.sel=null;run.info='';renderAll();return;}
  run.sel={type:'shop',i};const d=UNITS[it.id];
  run.info=`${d.e} <b>${d.n}</b> ⚔ ${d.atk} ♥ ${d.hp}. ${abilityText(d)} <em>Stuknij półkę, żeby kupić. Stuknij kartę jeszcze raz, żeby odznaczyć.</em>`;
  renderAll();}
function onShelf(i){if(run.phase!=='shop')return;const s=run.sel;
  if(s&&s.type==='shop'){buyTo(s.i,i);return;}
  if(s&&s.type==='shelf'){
    if(s.i===i){run.sel=null;run.info='';renderAll();return;}
    const a=run.shelves[s.i],b=run.shelves[i];
    if(a&&b&&a.id===b.id&&run.night>=3&&a.copies+b.copies<=6){const bf=level(b);b.copies+=a.copies;b.bonusAtk+=a.bonusAtk;b.bonusHp+=a.bonusHp;run.shelves[s.i]=null;lvlToast(b,bf);}
    else{run.shelves[i]=a;run.shelves[s.i]=b;}
    run.sel=null;run.info='';afterRoster();return;}
  const u=run.shelves[i];if(!u){run.sel=null;run.info='';renderAll();return;}
  run.sel={type:'shelf',i};run.info=unitInfo(u);renderAll();}

/* ================= NIGHT: a readable sequence of beats ================= */
let paused=false;
const wait=ms=>new Promise(res=>{let left=ms;const tick=()=>{if(!paused)left-=50*run.speed;if(left<=0)res();else setTimeout(tick,50);};setTimeout(tick,50);});
function mkAlly(u,i,tokId){const id=tokId||u.id,d=UNITS[id];const s=tokId?{atk:d.atk,hp:d.hp}:stat(u);
  return{id,shelf:i,atk:s.atk,hp:s.hp,max:s.hp,shell:d.shell||0,el:null};}
const aliveA=()=>battle.allies.filter(a=>a&&a.hp>0);
const frontA=()=>battle.allies.find(a=>a&&a.hp>0);
const N=a=>`${UNITS[a.id].e} ${UNITS[a.id].n}`;
function updEnemy(e){if(!e.el)return;const h=e.el.querySelector('.ep .h');if(h)h.textContent='♥'+Math.max(0,e.hp);const a=e.el.querySelector('.ep .a');if(a)a.textContent='⚔'+e.atk;}
function updAlly(a){if(!a.el)return;const p=a.el.querySelectorAll('.pill');if(p[1])p[1].textContent='♥ '+Math.max(0,a.hp);if(p[0])p[0].textContent='⚔ '+a.atk;}
function hitEnemy(e,dmg){e.hp-=dmg;float(e,'-'+dmg,'dmg');anim(e,'hurt');updEnemy(e);}
function hitAlly(a,dmg){if(a.shell>0){a.shell=0;float(a,'skorupka pęka','block');return false;}a.hp-=dmg;float(a,'-'+dmg,'dmg');anim(a,'hurt');updAlly(a);return true;}
function buffA(a,x,y){a.atk+=x;a.hp+=y;a.max+=y;float(a,`+${x}/+${y}`,'buff');anim(a,'pulse');updAlly(a);}
function clearDeadEnemies(){const B=battle;const out=[];
  B.enemies.forEach(e=>{if(e.hp>0){out.push(e);return;}if(e.split){out.push(mkEnemy('zarodnik'),mkEnemy('zarodnik'));}});
  const splitter=B.enemies.find(e=>e.hp<=0&&e.split);B.enemies=out;renderQueue();return splitter;}
function resolveAllyDeaths(){const B=battle;let msg='';
  B.allies.forEach((a,i)=>{if(!a||a.hp>0||a.gone)return;a.gone=true;B.lostAny=true;const d=UNITS[a.id];
    if(d.spawn){B.allies[i]=mkAlly(null,i,d.spawn);msg=`${N(a)} się psuje… ale ${d.spawn==='suchar'?'czerstwieje w Suchar':'zostawia Ziemniaczka'}.`;}
    else msg=`${N(a)} się psuje.`;});
  renderShelves();return msg;}

async function startNight(){
  run.phase='fight';run.sel=null;$('#bubble').hidden=true;hintQ=[];
  battle={allies:run.shelves.map((u,i)=>u?mkAlly(u,i):null),enemies:WAVES[run.night-1].map(mkEnemy),recipes:findRecipes(run.shelves.map(u=>u?u.id:null)),lostAny:false};
  run.log='Drzwi się zamykają. Światło gaśnie…';
  renderAll();hint('fight');if(!meta.seen.fight){paused=true;}
  await wait(900);
  // 1) dishes cook, one at a time
  for(let k=0;k<battle.recipes.length;k++){const x=battle.recipes[k];const b=dishBonus(x.r);
    const el=document.getElementById('br-'+k);if(el)el.classList.add('cook');
    log(`<span class="tag">Danie</span>${x.r.e} ${x.r.n}: składniki +${b}/+${b}`);
    for(let s=x.start;s<x.start+x.len;s++)buffA(battle.allies[s],b,b);
    await wait(1100);if(el)el.classList.remove('cook');}
  // 2) start-of-night abilities, top to bottom
  for(let i=0;i<5;i++){const a=battle.allies[i];if(!a||UNITS[a.id].tr!=='start')continue;
    a.el.classList.add('acting');
    if(a.id==='cebula'){log(`<span class="tag">Start nocy</span>${N(a)} wyciska łzy: 1 obrażenie każdemu potworowi.`);battle.enemies.forEach(e=>hitEnemy(e,1));}
    if(a.id==='czosnek'){const e=battle.enemies[0];if(e){log(`<span class="tag">Start nocy</span>${N(a)} odstrasza: 3 obrażenia dla ${e.n}.`);hitEnemy(e,3);}}
    if(a.id==='maslo'){log(`<span class="tag">Start nocy</span>${N(a)}: półka nad i pod +2/+2.`);[i-1,i+1].forEach(j=>{const b=battle.allies[j];if(b)buffA(b,2,2);});}
    await wait(1100);if(a.el)a.el.classList.remove('acting');
    const sp=clearDeadEnemies();if(sp){log(`${sp.n} pęka na dwa Zarodniki!`);await wait(800);}}
  // 3) clashes
  let n=0;
  while(aliveA().length&&battle.enemies.length&&n<80){n++;await clash(n);}
  endNight(battle.enemies.length===0);
}
async function clash(n){const B=battle;const a=frontA(),e=B.enemies[0];
  renderShelves();renderQueue();
  log(`${N(a)} <b>⚔${a.atk}</b> &nbsp;kontra&nbsp; ${e.n} <b>⚔${e.atk}</b>`);
  await wait(450);
  anim(a,'atk-up');anim(e,'atk-down');
  await wait(180);
  hitEnemy(e,a.atk);
  const ud=UNITS[a.id];let extra='';
  if(ud.splash&&B.enemies[1]){hitEnemy(B.enemies[1],a.atk);extra=` Ostre! Obrywa też ${B.enemies[1].n}.`;}
  const landed=hitAlly(a,e.atk);
  if(!landed)extra+=' Skorupka przyjęła cios.';
  if(landed&&e.sour&&a.hp>0&&a.atk>1){a.atk--;updAlly(a);float(a,'-1 ⚔','debuff');extra+=` ${e.n} skwasza: ${UNITS[a.id].n} −1 ataku.`;}
  if(extra)log(`${N(a)} <b>⚔${a.atk}</b> &nbsp;kontra&nbsp; ${e.n} <b>⚔${e.atk}</b><br><span style="color:var(--moon);font-size:13px">${extra.trim()}</span>`);
  await wait(800);
  // deaths
  const dead=B.enemies.filter(x=>x.hp<=0).map(x=>x.n);
  const sp=clearDeadEnemies();
  const am=resolveAllyDeaths();
  if(dead.length||am){log([dead.length?`${dead.join(', ')} ${dead.length>1?'znikają':'znika'}.`:'',sp?'Pęka na dwa Zarodniki!':'',am].filter(Boolean).join(' '));await wait(800);}
  // after-clash effects
  const f=frontA();const honey=B.allies.find(x=>x&&x.hp>0&&x.id==='miod');
  if(honey&&f&&f.hp<f.max){const h=Math.min(2,f.max-f.hp);f.hp+=h;float(f,'+'+h,'heal');updAlly(f);anim(honey,'pulse');log(`<span class="tag">Po starciu</span>🍯 Miód leczy: ${N(f)} +${h}.`);await wait(800);}
  const boss=B.enemies.find(x=>x.boss);
  if(boss){boss.clash++;
    if(boss.key==='krol'&&boss.clash%3===0){B.enemies.push(mkEnemy('zarodnik'));renderQueue();log(`<span class="tag">Boss</span>👑 Król Pleśni wypuszcza Zarodnik na koniec kolejki.`);await wait(900);}
    if(boss.key==='sloik'&&boss.clash%2===0&&aliveA().length){log(`<span class="tag">Boss</span>Słoik się otwiera. Smród! 1 obrażenie dla wszystkich.`);aliveA().forEach(x=>hitAlly(x,1));await wait(800);const m=resolveAllyDeaths();if(m){log(m);await wait(700);}}}
}
function endNight(win){
  const n=run.night;let lost=0;
  if(!win){lost=WAVES[n-1].some(k=>ENEMIES[k].boss)?2:1;run.hp=Math.max(0,run.hp-lost);}
  let ferm=0;run.shelves.forEach(u=>{if(u&&u.id==='ogorek'){u.bonusAtk++;u.bonusHp++;ferm++;}});
  if(win){run.won++;award('torun');if(!battle.lostAny)award('zakopane');if(n===5)award('wieliczka');if(n===10)award('ciechocinek');}
  meta.best=Math.max(meta.best,win?n:n-1);saveMeta();renderHUD();
  log(win?'Ostatni potwór znika w szczelinie zamrażalnika. Cisza.':'Składniki padły. Pleśń panoszy się do rana…');
  setTimeout(()=>{if(run.hp<=0)gameOver(false);else if(win&&n===10)gameOver(true);else summary(win,lost,ferm);},900/run.speed+300);}
function unlockBox(next){const t=UNLOCK[next];if(!t||t===1)return '';const list=Object.values(UNITS).filter(u=>u.t===t);
  return `<div class="unlock"><b>Od jutra na targu:</b><span class="ue">${list.map(u=>u.e).join(' ')}</span>${t===2?'Od jutra możesz też łączyć takie same składniki na jednej półce.':''}</div>`;}
function summary(win,lost,ferm){
  const mags=run.newMagnets.splice(0).map(id=>{const m=MAGNETS.find(x=>x.id===id);return `${m.e} ${m.t}`;});
  const next=run.night+1;
  overlay(`<span class="kicker">Noc ${run.night} ${win?'przetrwana':'przegrana'}</span>
    <h2>${win?rnd(QUIPS_WIN):rnd(QUIPS_LOSE)}</h2>
    <div class="rows">
      <div class="row"><span>Rano dostajesz</span><b>+${INCOME} 🍪</b></div>
      ${!win?`<div class="row"><span>Zakwas oberwał</span><b>−${lost} ♥</b></div>`:''}
      ${ferm?`<div class="row"><span>Ogórki się ukisiły</span><b>+1/+1</b></div>`:''}
      ${mags.length?`<div class="row"><span>Nowy magnes na lodówkę</span><b>${mags.join(', ')}</b></div>`:''}
    </div>
    ${next===2?'<div class="unlock"><b>Od jutra:</b> przepisy. Pasujące składniki na sąsiednich półkach gotują danie.</div>':''}
    ${unlockBox(next)}
    ${next===5?'<div class="unlock"><b>Uwaga:</b> następnej nocy przychodzi 👑 Król Pleśni.</div>':''}
    ${next===10?'<div class="unlock"><b>Uwaga:</b> ostatnia noc. Z tyłu lodówki rusza się Zapomniany Słoik.</div>':''}
    <button class="btn primary big" data-act="next-day">Rano: idę na targ ▶</button>`);}
function nextDay(){run.crumbs+=INCOME;run.night++;run.phase='shop';battle=null;run.info='';run.sel=null;
  run.preview=WAVES[run.night-1].map(mkEnemy);rollShop(run.night===2);closeOverlay();renderAll();
  if(run.night===2)hint('recipe');if(run.night===3)hint('merge');if(run.night===5)hint('tier3');}
function gameOver(win){meta.runs++;if(win)meta.won++;saveMeta();
  const nm=run.newMagnets.map(id=>{const m=MAGNETS.find(x=>x.id===id);return m.e+' '+m.t;}).join(', ');
  const nr=run.newRecipes.map(id=>{const r=RECIPES.find(x=>x.id===id);return r.e+' '+r.n;}).join(', ');
  const rows=`${nr?`<div class="row"><span>Nowe przepisy</span><b>${nr}</b></div>`:''}${nm?`<div class="row"><span>Nowe magnesy</span><b>${nm}</b></div>`:''}`;
  overlay(win?`<span class="kicker">Niedziela rano</span><h2>Babcia wróciła z Ciechocinka!</h2><p class="hand">${NOTES[NOTES.length-1]}</p>
      <div class="rows"><div class="row"><span>Przetrwane noce</span><b>10/10</b></div>${rows}</div>
      <button class="btn primary big" data-act="to-hub">Zamknij lodówkę</button>`
    :`<span class="kicker">Zakwas opadł</span><h2>Rano wszystko wraca na półki.</h2><p>Przetrwane noce: <b>${run.won}</b>. Pleśń wróci jutro, ale lodówka pamięta przepisy i magnesy.</p>
      <div class="rows">${rows}<div class="row"><span>Najlepszy wynik</span><b>noc ${meta.best}</b></div></div>
      <button class="btn primary big" data-act="to-hub">Zamknij lodówkę</button>`);}

/* ================= OVERLAYS ================= */
function overlay(html){const o=$('#overlay');o.innerHTML=`<div class="sheet" role="dialog">${html}</div>`;o.hidden=false;paused=true;}
function closeOverlay(){$('#overlay').hidden=true;paused=!$('#bubble').hidden&&run&&run.phase==='fight';}
function showBook(){overlay(`<span class="kicker">Książka kucharska babci</span><h2>Przepisy ${meta.recipes.length}/${RECIPES.length}</h2>
  <p style="font-size:14px;color:var(--ink-soft)">Składniki na sąsiednich półkach, w dowolnej kolejności. Danie z 2 składników daje każdemu +2/+2, z 3 składników +3/+3.</p>
  <div>${RECIPES.map(r=>{const k=meta.recipes.includes(r.id);return k?`<div class="recipe"><span class="re">${r.e}</span><span><span class="rn">${r.n}</span><br><span class="ri">${r.need.map(x=>UNITS[x].e).join(' + ')}</span><br><span class="rf">Każdy składnik +${dishBonus(r)}/+${dishBonus(r)}</span></span></div>`
    :`<div class="recipe unknown"><span class="re">❔</span><span><span class="rn">???</span><br><span class="ri">${UNITS[r.need[0]].e}${' + ?'.repeat(r.need.length-1)}</span></span></div>`;}).join('')}</div>
  <button class="btn primary" data-act="close-overlay">Zamknij</button>`);}
function showHelp(){overlay(`<span class="kicker">Jak grać</span><h2>Przetrwaj 10 nocy do powrotu Babci</h2>
  <ol class="howto">
   <li><b>Rano targ.</b> Stuknij kartę, potem półkę. Każdy składnik kosztuje ${COST} 🍪.</li>
   <li><b>Nocą walka idzie sama.</b> Najwyższy składnik bije się z pierwszym potworem z lewej, oba zadają sobie obrażenia naraz. Kto padnie, ustępuje miejsca następnemu.</li>
   <li><b>Od nocy 2: przepisy.</b> Pasujące składniki na sąsiednich półkach gotują danie i dostają bonus.</li>
   <li><b>Od nocy 3: łączenie.</b> Ten sam składnik na tej samej półce rośnie. 3 sztuki to ★★.</li>
   <li><b>Przegrana noc</b> zabiera Zakwasowi ♥ (boss zabiera 2). Przepisy i magnesy zostają na lodówce na zawsze.</li>
  </ol><button class="btn primary" data-act="close-overlay">Rozumiem</button>`);}

/* ================= INPUT ================= */
app.addEventListener('click',ev=>{const t=ev.target.closest('[data-act]');if(!t)return;const act=t.dataset.act,i=+t.dataset.i;
  switch(act){
    case 'open':{$('#door').classList.add('opening');setTimeout(()=>{$('#hub').hidden=true;$('#game').hidden=false;newRun();renderAll();
      const it=$('#interior');it.classList.remove('lit');void it.offsetWidth;it.classList.add('lit');hint('buy');},matchMedia('(prefers-reduced-motion: reduce)').matches?0:520);break;}
    case 'book':showBook();break;
    case 'help':showHelp();break;
    case 'close-overlay':closeOverlay();break;
    case 'shop':if(run.phase==='shop')onShop(i);break;
    case 'shelf':onShelf(i);break;
    case 'enemy':{const e=enemyList()[i];if(!e)break;const txt=`<b>${e.n}</b> ⚔ ${e.atk} ♥ ${Math.max(0,e.hp)}. ${e.ab}`;run.phase==='shop'?info(txt):log(txt);break;}
    case 'bracket':{const x=(run.phase==='fight'?battle.recipes:run.curRecipes)[i];if(!x)break;const b=dishBonus(x.r);const txt=`${x.r.e} <b>${x.r.n}</b>: na start nocy każdy składnik dania dostaje +${b}/+${b}.`;run.phase==='shop'?info(txt):log(txt);break;}
    case 'sell':{const s=run.sel;if(run.phase==='shop'&&s&&s.type==='shelf'&&run.shelves[s.i]){run.crumbs+=level(run.shelves[s.i]);run.shelves[s.i]=null;run.sel=null;run.info='';afterRoster();}break;}
    case 'reroll':if(run.crumbs>=1){run.crumbs--;rollShop();run.sel=null;run.info='';renderAll();}break;
    case 'night':if(run.shelves.some(Boolean))startNight();break;
    case 'speed':run.speed=run.speed===1?2:run.speed===2?3:1;renderPanel();break;
    case 'bubble-ok':{const k=hintQ.shift();if(k){meta.seen[k]=true;saveMeta();}showHint();if($('#bubble').hidden&&$('#overlay').hidden)paused=false;break;}
    case 'next-day':nextDay();break;
    case 'to-hub':closeOverlay();paused=false;run=null;battle=null;$('#bubble').hidden=true;hintQ=[];$('#game').hidden=true;$('#hub').hidden=false;renderHub();break;
  }
});

renderHub();
})();
</script>
