<title>Midnight Pantry</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap">
<style>
/* Layout: one phone-tall column over a pixel plasma background with a CRT overlay. Rows: HUD, freezer (enemies), centre readout, shelf (your 5), market cards, action bar. Single deliberate dark look. */
:root{
  --ink:#140E1C; --panel:rgba(22,17,33,.9); --panel-edge:#3D3456; --text:#F4EFE6; --muted:#A79FBF;
  --card:#F4EFE6; --gold:#FFC93C; --atk:#FF8A1F; --hp:#F0405A;
  --orange:#FF7A1A; --orange-d:#B34D00; --blue:#2F7CF6; --blue-d:#1B4FA8; --green:#27C46B; --green-d:#17834A;
  --red:#EF4444; --red-d:#A12828; --gray:#4A4560; --gray-d:#2D2A3D;
  --r1:#C9C2D6; --r2:#4FA3FF; --r3:#C77DFF;
  --f:'Jersey 10','Courier New',monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:#120D1A;color:var(--text);font-family:var(--f);font-weight:400;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#bg{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:0}
.crt{position:fixed;inset:0;pointer-events:none;z-index:200;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
.crt::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.6) 100%)}
#app{position:relative;z-index:1;height:100%;max-width:440px;margin:0 auto;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.shadowtxt{text-shadow:2px 2px 0 rgba(0,0,0,.7)}

/* buttons */
.btn{font-family:var(--f);font-weight:400;font-size:23px;letter-spacing:.02em;color:#fff;border-radius:12px;padding:12px 14px;line-height:1;box-shadow:0 5px 0 var(--d,#000);transition:transform .06s,box-shadow .06s;text-shadow:1px 2px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--d,#000)}
.btn[disabled]{filter:grayscale(.8) brightness(.6);pointer-events:none}
.b-orange{background:var(--orange);--d:var(--orange-d)}.b-blue{background:var(--blue);--d:var(--blue-d)}.b-green{background:var(--green);--d:var(--green-d)}.b-red{background:var(--red);--d:var(--red-d)}.b-gray{background:var(--gray);--d:var(--gray-d)}
.wiggle{animation:wig 2.6s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}

/* title */
#title{align-items:center;justify-content:center;gap:18px;text-align:center}
.logo{font-weight:400;font-size:clamp(56px,17vw,72px);line-height:.95;color:var(--gold);text-shadow:3px 4px 0 #8A2BE2,6px 8px 0 rgba(0,0,0,.6)}
.logo span{display:inline-block;animation:bob 1.6s ease-in-out infinite}
.logo .l2{color:#fff;font-size:.62em;display:block;margin-top:6px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
.parade{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;max-width:360px}
.parade img{width:48px;height:48px;animation:bob 1.4s ease-in-out infinite}
.titlebtns{display:flex;flex-direction:column;gap:12px;width:min(100%,300px)}
.titlebtns .btn{font-size:28px;padding:16px}
.tstats{color:var(--muted);font-size:19px}
.tstats b{color:var(--gold)}

/* hud */
.hud{display:flex;align-items:center;gap:8px;height:40px}
.hearts{display:flex;gap:2px}
.hearts img{width:22px;height:22px}
.hud .night{flex:1;text-align:center;font-weight:400;font-size:23px;color:var(--gold);white-space:nowrap}
.coins{display:flex;align-items:center;gap:6px;background:var(--panel);border:3px solid var(--panel-edge);border-radius:10px;padding:3px 10px 3px 6px;font-weight:400;font-size:26px;color:var(--gold)}
.coins img{width:20px;height:20px}
.iconbtn{width:36px;height:36px;border-radius:10px;background:var(--panel);border:3px solid var(--panel-edge);display:grid;place-items:center;font-weight:400;font-size:20px}

/* panels */
.panel{background:var(--panel);border:3px solid var(--panel-edge);border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,.5);padding:6px 8px 8px;position:relative}
.plabel{font-size:15px;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;padding:0 2px 2px}
.row{display:flex;gap:4px;justify-content:center;align-items:flex-end;min-height:96px}
.unit{position:relative;flex:0 1 64px;min-width:40px;width:64px;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .12s}
.unit .sp{width:64px;max-width:100%;height:auto;aspect-ratio:1;transition:filter .1s}
.unit.empty{height:84px;border:3px dashed #3D3456;border-radius:12px;box-sizing:border-box}
.unit.empty.valid{border-color:var(--green);background:rgba(39,196,107,.1)}
.unit.sel{transform:translateY(-8px)}
.unit.sel .sp{filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 6px var(--gold))}
.unit.swapok{outline:2px dashed var(--gold);outline-offset:2px;border-radius:12px}
.unit.dead .sp{filter:grayscale(1) brightness(.5)}
.unit.dead{opacity:.55}
.unit.front::before{content:"▶";position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:15px;color:var(--gold)}
.stars{height:14px;font-size:17px;line-height:14px;color:var(--gold);letter-spacing:-1px;text-shadow:1px 1px 0 #000}
.badges{display:flex;justify-content:space-between;width:64px;max-width:100%;margin-top:-10px;position:relative;z-index:2}
.bdg{min-width:22px;height:22px;padding:0 3px;box-sizing:border-box;border-radius:6px;display:grid;place-items:center;font-weight:400;font-size:19px;color:#fff;border:2px solid var(--ink);text-shadow:1px 1px 0 rgba(0,0,0,.4)}
.bdg.a{background:var(--atk)}.bdg.h{background:var(--hp)}
.pips{display:flex;gap:3px;height:8px;margin-top:3px}
.pips i{width:8px;height:6px;border-radius:2px;background:#3D3456}
.pips i.on{background:var(--gold)}
.enemy .sp{width:64px}
.enemy.boss{flex-basis:96px;width:96px}.enemy.boss .sp{width:96px}
.enemy.small{flex-basis:48px;width:48px}.enemy.small .sp{width:48px}
.enemy .badges{width:100%}
#center{flex:1;min-height:84px;max-height:170px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:4px;overflow:hidden}
#center .ct{font-weight:400;font-size:28px;color:var(--gold)}
#center .cd{font-size:19px;line-height:1.3;color:var(--text);max-width:340px}
#center .cd em{font-style:normal;color:var(--gold)}
#center .tag{display:inline-block;font-size:15px;padding:2px 6px;border-radius:6px;background:#3D3456;color:var(--gold);margin-right:4px;vertical-align:1px}
.clash{display:flex;align-items:center;gap:14px;font-weight:400}
.clash .n{font-size:51px;line-height:1}
.clash .n.a{color:var(--atk)}.clash .n.e{color:var(--hp)}
.clash .vs{font-size:20px;color:var(--muted)}

/* shop */
.shop{display:flex;gap:8px;justify-content:center;align-items:flex-end;min-height:132px;padding-top:12px}
.card{position:relative;width:88px;height:120px;background:var(--card);color:var(--ink);border:3px solid var(--rc,var(--r1));border-radius:12px;box-shadow:0 5px 0 rgba(0,0,0,.5),inset 0 0 0 2px var(--ink);display:flex;flex-direction:column;align-items:center;padding-top:6px;box-sizing:border-box;transition:transform .15s}
.card .sp{width:48px;height:48px;margin:4px 0}
.card .cn{font-weight:400;font-size:17px;line-height:1.05;text-align:center;padding:0 4px;min-height:28px;display:flex;align-items:center}
.card .cs{display:flex;gap:4px}
.card .cs .bdg{min-width:20px;height:20px;font-size:17px}
.card .price{position:absolute;top:-10px;right:-10px;width:28px;height:28px;border-radius:50%;background:var(--gold);border:2px solid var(--ink);display:grid;place-items:center;font-weight:400;font-size:19px;color:var(--ink)}
.card .own{position:absolute;top:-10px;left:-8px;background:var(--green);color:#fff;border:2px solid var(--ink);border-radius:8px;font-size:15px;font-weight:400;padding:1px 5px}
.card.sel{transform:translateY(-14px) scale(1.06) rotate(0deg)!important;animation:none;box-shadow:0 0 0 3px var(--gold),0 10px 0 rgba(0,0,0,.5)}
.card.sold{visibility:hidden}
.card.poor{filter:brightness(.6)}
.actions{display:flex;gap:8px;height:56px}
.actions .btn{flex:1}
.actions .btn.grow{flex:1.7}

/* fx */
#fx{position:absolute;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.ftxt{position:absolute;font-weight:400;white-space:nowrap;transform:translate(-50%,-50%);text-shadow:2px 2px 0 #000,-1px -1px 0 #000}
.part{position:absolute;width:6px;height:6px}
.flash{animation:flash .25s}
@keyframes flash{0%{filter:brightness(3) saturate(0)}100%{filter:none}}
.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.lungeU{animation:lu .28s ease-out}@keyframes lu{45%{transform:translateY(-18px) scale(1.12)}}
.lungeD{animation:ld .28s ease-out}@keyframes ld{45%{transform:translateY(18px) scale(1.12)}}
.hurt{animation:hurt .3s}@keyframes hurt{20%{transform:translateX(-5px) rotate(-6deg)}50%{transform:translateX(5px) rotate(5deg)}80%{transform:translateX(-2px)}}
.act{animation:actK .5s}@keyframes actK{40%{transform:translateY(-10px) scale(1.15)}}

/* overlay */
#overlay{position:absolute;inset:0;z-index:120;background:rgba(10,7,16,.72);display:grid;place-items:center;padding:16px}
.sheet{width:100%;max-width:380px;max-height:90%;overflow:auto;background:var(--panel);border:3px solid var(--panel-edge);border-radius:16px;box-shadow:0 8px 0 rgba(0,0,0,.6);padding:18px;display:flex;flex-direction:column;gap:12px;animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.sheet h2{margin:0;font-size:38px;line-height:1;color:var(--gold);text-shadow:2px 3px 0 rgba(0,0,0,.6);text-align:center}
.sheet p{margin:0;font-size:20px;line-height:1.35;text-align:center}
.tally{display:flex;flex-direction:column;gap:6px}
.trow{display:flex;justify-content:space-between;font-size:23px;padding:8px 10px;background:rgba(255,255,255,.05);border-radius:8px;opacity:0;transform:translateX(-10px);transition:opacity .2s,transform .2s}
.trow.in{opacity:1;transform:none}
.trow b{color:var(--gold)}
.trow b.bad{color:var(--hp)}
.howto{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:20px;line-height:1.3}
.coll{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.coll div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;text-align:center;line-height:1.05}
.coll img{width:48px;height:48px}
.coll .lock img{filter:brightness(0) opacity(.45)}
@media (max-height:700px){.row{min-height:84px}.unit{flex-basis:56px}.card{height:108px;width:82px}.card .sp{width:48px;height:48px}.shop{min-height:118px}#center{min-height:64px}#center .cd{font-size:17px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<canvas id="bg" width="72" height="128" aria-hidden="true"></canvas>
<div id="app">
  <section id="title" class="screen">
    <div class="logo shadowtxt" id="logo"></div>
    <div class="parade" id="parade"></div>
    <div class="titlebtns">
      <button class="btn b-orange wiggle" data-act="play">GRAJ</button>
      <button class="btn b-blue" data-act="help">JAK GRAĆ</button>
      <button class="btn b-gray" data-act="coll">KSIĄŻKA KUCHARSKA</button>
    </div>
    <div class="tstats" id="tstats"></div>
  </section>

  <section id="game" class="screen" hidden>
    <div class="hud">
      <div class="hearts" id="hearts" aria-label="Zakwas"></div>
      <div class="night shadowtxt" id="nightLbl"></div>
      <div class="coins" id="coins"></div>
      <button class="iconbtn" data-act="mute" id="muteBtn" aria-label="Dźwięk">♪</button>
      <button class="iconbtn" data-act="help" aria-label="Jak grać">?</button>
    </div>
    <div class="panel"><div class="plabel"><span id="eLabel">ZAMRAŻALNIK</span><span>▶ pierwszy z lewej</span></div><div class="row" id="eRow"></div></div>
    <div class="panel" id="center"></div>
    <div class="panel"><div class="plabel"><span>TWOJA PÓŁKA</span><span id="tCount"></span></div><div class="row" id="tRow"></div></div>
    <div class="shop" id="shop"></div>
    <div class="actions" id="actions"></div>
  </section>

  <div id="fx"></div>
  <div id="overlay" hidden></div>
</div>
<div class="crt" aria-hidden="true"></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const app=$('#app'),fx=$('#fx');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= SOUND (tiny synth, starts after first tap) ================= */
let AC=null,muted=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,vol,slide,delay){if(muted)return;const a=ac();if(!a)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
  g.gain.setValueAtTime(vol||.04,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03);}
const SFX={
  tap:()=>tone(700,.04,'square',.025),
  buy:()=>{tone(523,.06,'square',.04);tone(784,.09,'square',.04,0,.06);},
  coin:i=>tone(988+(i||0)*60,.07,'square',.035),
  merge:()=>[523,659,784,1046,1318,1568].forEach((f,i)=>tone(f,.14,'square',.045,0,i*.055)),
  hit:()=>tone(180,.12,'sawtooth',.05,.45),
  hurt:()=>tone(120,.16,'square',.045,.6),
  block:()=>tone(1400,.05,'triangle',.04),
  die:()=>tone(420,.3,'triangle',.05,.2),
  heal:()=>{tone(660,.08,'triangle',.04);tone(880,.1,'triangle',.04,0,.07);},
  win:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.2,'triangle',.06,0,i*.1)),
  lose:()=>[392,330,262,196].forEach((f,i)=>tone(f,.24,'triangle',.06,0,i*.14)),
  whoosh:()=>tone(800,.18,'sawtooth',.018,.3)
};

/* ================= BACKGROUND (pixel plasma) ================= */
const bg=$('#bg'),bctx=bg.getContext('2d'),bimg=bctx.createImageData(72,128);
const MOODS={calm:[[18,52,58],[42,24,64],[24,32,70],[60,34,40]],fight:[[70,22,48],[30,18,56],[96,40,30],[40,20,40]],win:[[24,70,50],[30,40,80],[90,80,30],[40,30,70]]};
let mood='calm',bgSpeed=1,bgT=0,lastBg=0;
function lerp(a,b,t){return a+(b-a)*t;}
function drawBg(now){
  if(now-lastBg>40||!lastBg){const dt=Math.min(.1,(now-(lastBg||now))/1000);lastBg=now;bgT+=dt*bgSpeed;
    const P=MOODS[mood],d=bimg.data,T=bgT*.6;
    for(let y=0;y<128;y++)for(let x=0;x<72;x++){
      const cx=x-36,cy=y-64,r=Math.sqrt(cx*cx+cy*cy),ang=Math.atan2(cy,cx);
      let v=Math.sin(r*.09-T*2.2+ang*2)+Math.sin(x*.07+T)+Math.sin((x+y)*.05-T*1.3);
      v=(v+3)/6;const q=Math.floor(v*7)/7;const k=q*3,i0=Math.min(3,Math.floor(k)),i1=Math.min(3,i0+1),f=k-i0;
      const c0=P[i0],c1=P[i1],i=(y*72+x)*4;
      d[i]=lerp(c0[0],c1[0],f);d[i+1]=lerp(c0[1],c1[1],f);d[i+2]=lerp(c0[2],c1[2],f);d[i+3]=255;}
    bctx.putImageData(bimg,0,0);}
  if(!RM)requestAnimationFrame(drawBg);}
requestAnimationFrame(drawBg);

let shakeT=0;
function shake(p){if(RM)return;const t0=performance.now(),dur=180+p*40;const f=()=>{const e=performance.now()-t0;if(e>dur){app.style.transform='';return;}
  const k=(1-e/dur)*p;app.style.transform=`translate(${(Math.random()*2-1)*k}px,${(Math.random()*2-1)*k}px)`;requestAnimationFrame(f);};f();}
function rel(el){const r=el.getBoundingClientRect(),g=app.getBoundingClientRect();return{x:r.left+r.width/2-g.left,y:r.top+r.height/2-g.top,w:r.width,h:r.height};}
function ftxt(el,text,color,size,dy){if(!el||!el.isConnected)return;const p=rel(el);const t=document.createElement('div');t.className='ftxt';t.textContent=text;
  t.style.left=p.x+'px';t.style.top=(p.y-(dy||10))+'px';t.style.color=color||'#fff';t.style.fontSize=(size||22)+'px';fx.appendChild(t);
  if(RM){setTimeout(()=>t.remove(),700);return;}
  t.animate([{transform:'translate(-50%,-50%) scale(.4)',opacity:0},{transform:'translate(-50%,-80%) scale(1.25)',opacity:1,offset:.2},{transform:'translate(-50%,-160%) scale(1)',opacity:0}],{duration:900,easing:'cubic-bezier(.2,.8,.3,1)'});
  setTimeout(()=>t.remove(),900);}
function burst(el,colors,n){if(RM||!el||!el.isConnected)return;const p=rel(el);for(let i=0;i<(n||14);i++){const q=document.createElement('div');q.className='part';
  q.style.background=rnd(colors);q.style.left=p.x+'px';q.style.top=p.y+'px';fx.appendChild(q);const a=Math.random()*Math.PI*2,d=30+Math.random()*50;
  q.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+20}px)`,opacity:0}],{duration:500+Math.random()*300,easing:'cubic-bezier(.1,.8,.3,1)'});
  setTimeout(()=>q.remove(),850);}}
function anim(el,cls){if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);}
function flyTo(fromEl,toEl,src,done){if(RM||!fromEl||!toEl){done();return;}const a=rel(fromEl),b=rel(toEl);const im=document.createElement('img');im.src=src;im.className='px';
  im.style.cssText=`position:absolute;width:56px;height:56px;left:${a.x-28}px;top:${a.y-28}px;z-index:60`;fx.appendChild(im);
  im.animate([{transform:'translate(0,0) scale(1) rotate(0)'},{transform:`translate(${(b.x-a.x)/2}px,${(b.y-a.y)/2-60}px) scale(1.2) rotate(-12deg)`},{transform:`translate(${b.x-a.x}px,${b.y-a.y}px) scale(.8) rotate(0)`}],{duration:380,easing:'ease-in-out'});
  setTimeout(()=>{im.remove();done();},370);}
function countTo(el,from,to){if(RM||from===to){el.textContent=to;return;}const t0=performance.now(),dur=350;const f=()=>{const k=Math.min(1,(performance.now()-t0)/dur);el.textContent=Math.round(from+(to-from)*k);if(k<1)requestAnimationFrame(f);};f();}

let run=null,B=null,uid=0,paused=false;
function tierPool(){return run.night>=5?3:run.night>=3?2:1;}

function newRun(){run={night:1,hp:MAXHP,coins:10,team:Array(SLOTS).fill(null),shop:[],sel:null,phase:'shop',speed:1,won:0,newDishes:[]};rollShop();}
function rollShop(){const mt=tierPool();const pool=Object.keys(KINDS).filter(k=>KINDS[k].r<=mt);
  const owned=run.team.filter(u=>u&&u.t<3).map(u=>u.k);const n=run.night>=5?4:3;
  run.shop=Array.from({length:n},()=>({k:owned.length&&Math.random()<.4?rnd(owned):rnd(pool)}));}
function owner(k){return run.team.findIndex(u=>u&&u.k===k);}
function mkEnemy(k){const d=ENEMIES[k],n=run.night;const h=d.h+(d.boss?0:n-1),a=d.a+(d.boss?0:Math.floor((n-1)/3));return Object.assign({},d,{k,uid:++uid,a,h,max:h,clash:0});}
function unitName(u){return u.tok?TOKENS[u.k].n:KINDS[u.k].n[u.t-1];}

function center(title,desc){$('#center').innerHTML=`${title?`<div class="ct shadowtxt">${title}</div>`:''}<div class="cd">${desc||''}</div>`;}
function defaultCenter(){const n=run.night;let d;

  else if(n===2)d='Kup <em>3 takie same</em>, a same połączą się w lepszą formę ★★.';
  else if(n===3)d='Nowe składniki na targu! <em>Kolejne 3</em> kopie robią z ★★ danie ★★★.';

function select(sel){run.sel=sel;SFX.tap();
  if(!sel){defaultCenter();}
  else if(sel.type==='shop'){const c=run.shop[sel.i],K=KINDS[c.k],o=owner(c.k),u=o>=0?run.team[o]:null;
    const tail=u&&u.t<3?`<br><em>Masz już ${u.c}/3: ${u.c===2?'kupno połączy je w '+K.n[u.t]+' '+STARS[u.t]+'!':'jeszcze '+(3-u.c)+' do '+K.n[u.t]+'.'}</em>`:`<br><em>Ewolucja: ${K.n[1]} ★★ → ${K.n[2]} ★★★</em>`;
    center(K.n[0],infoUnit(c.k,1,tail));}
  else if(sel.type==='shelf'){const u=run.team[sel.i],K=KINDS[u.k],s=stat(u);
    center(`${K.n[u.t-1]} ${STARS[u.t-1]}`,infoUnit(u.k,u.t,`<br>Atak ${s.a} · Życie ${s.h}${u.t<3?` · ${u.c}/3 do ${K.n[u.t]}`:''}. <em>Stuknij inne miejsce, żeby przestawić.</em>`));}
  renderAll();}
function buy(){const s=run.sel;if(!s||s.type!=='shop')return;const c=run.shop[s.i];if(run.coins<COST)return;

    const u=run.team[o];u.c++;

    }else{renderAll();const el=document.getElementById('t-'+o);anim(el.querySelector('.sp'),'pop');ftxt(el,`${u.c}/3`,'#FFC93C',20,30);defaultCenter();}
  });}

  if(a.shell>0){a.shell--;ftxt(el,'BLOK!','#9FD3FF',18);SFX.block();return false;}
  d=Math.max(1,d-a.soft);a.h-=d;anim(el,'hurt');anim(el&&el.querySelector('.sp'),'flash');ftxt(el,'-'+d,'#F0405A',26);updA(i);return true;}
function buffA(i,x,y){const a=B.allies[i];if(!a)return;a.a+=x;a.h+=y;a.max+=y;const el=tEl(i);anim(el,'act');ftxt(el,`+${x}/+${y}`,'#7CF29A',18);updA(i);}
function clearDead(){const out=[];let split=false;B.enemies.forEach(e=>{if(e.h>0){out.push(e);return;}SFX.die();if(e.split){split=true;out.push(mkEnemy('zarodnik'),mkEnemy('zarodnik'));}});B.enemies=out;renderEnemies();return split;}
function allyDeaths(){let msg='';B.allies.forEach((a,i)=>{if(!a||a.h>0||a.gone)return;a.gone=true;B.lost=true;SFX.die();
  if(!a.tok&&KINDS[a.k].tr==='faint'){const tk=a.k==='ziemniak'?'kielek':'suchar';B.allies[i]=mkTok(tk,a.t);msg=`${KINDS[a.k].n[a.t-1]} się psuje… i zostawia ${TOKENS[tk].n}!`;}
  else msg=`${a.tok?TOKENS[a.k].n:KINDS[a.k].n[a.t-1]} się psuje.`;});renderTeam();return msg;}
function aName(a){return a.tok?TOKENS[a.k].n:KINDS[a.k].n[a.t-1];}

async function startNight(){run.phase='fight';run.sel=null;mood='fight';bgSpeed=2.2;
  B={allies:run.team.map(u=>u?mkAlly(u):null),enemies:WAVES[run.night-1].map(mkEnemy),lost:false};
  renderAll();center(`NOC ${run.night}`,'Drzwi się zamykają. Światło gaśnie…');SFX.whoosh();shake(3);
  await wait(900);
  for(let i=0;i<SLOTS;i++){const a=B.allies[i];if(!a||KINDS[a.k].tr!=='start')continue;const el=tEl(i);anim(el,'act');
    if(a.k==='cebula'){center('ŁZY!',`<span class="tag">START NOCY</span>${aName(a)}: ${a.t} obrażeń każdemu potworowi.`);B.enemies.forEach(e=>hitE(e,a.t));SFX.hit();shake(4);}
    if(a.k==='czosnek'){const e=B.enemies[0];if(e){center('CZOSNEK!',`<span class="tag">START NOCY</span>${aName(a)}: ${3*a.t} obrażeń dla ${e.n}.`);hitE(e,3*a.t,true);SFX.hit();shake(5);}}
    if(a.k==='maslo'){center('MASŁO!',`<span class="tag">START NOCY</span>Sąsiedzi ${aName(a)} +${a.t}/+${a.t}.`);[i-1,i+1].forEach(j=>{if(B.allies[j])buffA(j,a.t,a.t);});SFX.heal();}
    await wait(900);if(clearDead()){center('PĘKA!','Biała pleśń dzieli się na Zarodniki.');await wait(700);}}
  let n=0;while(frontI()>=0&&B.enemies.length&&n<80){n++;await clash(n);}
  endNight(B.enemies.length===0);}
async function clash(n){const i=frontI(),a=B.allies[i],e=B.enemies[0];
  renderTeam();renderEnemies();
  $('#center').innerHTML=`<div class="clash"><span class="n a shadowtxt">${a.a}</span><span class="vs">STARCIE ${n}</span><span class="n e shadowtxt">${e.a}</span></div><div class="cd">${aName(a)} kontra ${e.n}</div>`;
  await wait(380);
  anim(tEl(i),'lungeU');anim(eEl(e),'lungeD');SFX.whoosh();
  await wait(140);
  const big=a.a>=8;hitE(e,a.a,big);SFX.hit();shake(big?8:4);
  let extra='';
  if(a.k==='chili'&&!a.tok&&B.enemies[1]){hitE(B.enemies[1],a.a);extra='Ostre! Obrywa też następny.';}
  const landed=hitA(i,e.a);if(landed)SFX.hurt();
  if(landed&&e.sour&&a.h>0&&a.a>1){a.a--;updA(i);ftxt(tEl(i),'-1 ATK','#C7A3F0',16,40);extra+=' Skwaszony: −1 ataku.';}
  if(extra)$('#center .cd').innerHTML=`${aName(a)} kontra ${e.n}<br><em>${extra.trim()}</em>`;
  await wait(650);
  const sp=clearDead();const am=allyDeaths();
  if(sp||am){center('',[sp?'Biała pleśń pęka na dwa Zarodniki!':'',am].filter(Boolean).join(' '));await wait(700);}
  const f=frontI(),bi=B.allies.findIndex(x=>x&&x.h>0&&x.k==='burak'&&!x.tok);
  if(bi>=0&&f>=0){const fa=B.allies[f];if(fa.h<fa.max){const h=Math.min(2*B.allies[bi].t,fa.max-fa.h);fa.h+=h;updA(f);anim(tEl(bi),'act');ftxt(tEl(f),'+'+h,'#7CF29A',22);SFX.heal();
    center('BARSZCZ LECZY',`<span class="tag">PO STARCIU</span>${aName(fa)} +${h} życia.`);await wait(700);}}
  const boss=B.enemies.find(x=>x.boss);
  if(boss){boss.clash++;
    if(boss.k==='krol'&&boss.clash%3===0){B.enemies.push(mkEnemy('zarodnik'));renderEnemies();anim(eEl(boss),'act');center('KRÓL PLEŚNI','Na koniec kolejki dochodzi Zarodnik.');await wait(800);}
    if(boss.k==='sloik'&&boss.clash%2===0&&frontI()>=0){anim(eEl(boss),'act');center('SMRÓD!','Słoik się otwiera: 1 obrażenie dla wszystkich.');shake(5);
      B.allies.forEach((x,j)=>{if(x&&x.h>0)hitA(j,1);});await wait(700);const m=allyDeaths();if(m){center('',m);await wait(600);}}}
}
function endNight(win){const n=run.night;let lost=0;
  if(!win){lost=WAVES[n-1].some(k=>ENEMIES[k].boss)?2:1;run.hp=Math.max(0,run.hp-lost);}
  let ferm=0;run.team.forEach(u=>{if(u&&u.k==='ogorek'){u.ba+=u.t;u.bh+=u.t;ferm=Math.max(ferm,u.t);}});
  if(win)run.won++;meta.best=Math.max(meta.best,win?n:n-1);saveMeta();
  mood=win?'win':'fight';bgSpeed=win?1.4:.6;
  (win?SFX.win:SFX.lose)();if(!win)shake(10);renderHUD();
  center(win?'NOC PRZETRWANA!':'PLEŚŃ WYGRAŁA',win?'Ostatni potwór znika w szczelinie zamrażalnika.':`Zakwas traci ${lost} ♥.`);
  setTimeout(()=>{if(run.hp<=0)gameOver(false);else if(win&&n===10)gameOver(true);else cashOut(win,lost,ferm);},1100);}
function cashOut(win,lost,ferm){const rows=[['Dniówka',7]];if(win)rows.push(['Przetrwana noc',2]);
  const total=rows.reduce((s,r)=>s+r[1],0);run.pending=total;
  overlay(`<h2>${win?'NOC '+run.night+' PRZETRWANA':'NOC '+run.night+' PRZEGRANA'}</h2>
    <div class="tally">${rows.map(r=>`<div class="trow"><span>${r[0]}</span><b>+${r[1]}</b></div>`).join('')}
    ${!win?`<div class="trow"><span>Zakwas oberwał</span><b class="bad">−${lost} ♥</b></div>`:''}
    ${ferm?`<div class="trow"><span>Ogórki się ukisiły</span><b>+${ferm}/+${ferm}</b></div>`:''}</div>
    ${run.night===4?'<p>Następna noc: <b style="color:var(--hp)">KRÓL PLEŚNI</b></p>':''}${run.night===2?'<p>Od jutra na targu: <b style="color:var(--r2)">niebieskie</b> składniki.</p>':''}${run.night===4?'<p>Od jutra na targu: <b style="color:var(--r3)">fioletowe</b> składniki.</p>':''}
    <button class="btn b-orange" data-act="next">ZGARNIJ +${total} ▶</button>`);
  const tr=[...document.querySelectorAll('.trow')];tr.forEach((r,i)=>setTimeout(()=>{r.classList.add('in');SFX.coin(i);},250+i*260));}
function nextDay(){const old=run.coins;run.coins+=run.pending;run.night++;run.phase='shop';B=null;run.sel=null;run.preview=null;mood='calm';bgSpeed=1;
  rollShop();closeOverlay();renderAll();countTo($('#coinN'),old,run.coins);defaultCenter();SFX.coin(3);}
function gameOver(win){meta.runs++;if(win)meta.won++;saveMeta();
  const nd=run.newDishes.map(k=>`<div><img class="px" src="${IMG[k][2]}" alt="">${KINDS[k].n[2]}</div>`).join('');
  overlay(`<h2>${win?'BABCIA WRÓCIŁA!':'ZAKWAS OPADŁ'}</h2><p>${win?'Kuchnia przetrwała 10 nocy. Pleśń nie miała szans.':'Rano wszystko wraca na półki. Przetrwane noce: '+run.won+'.'}</p>
    ${nd?`<p>Nowe dania w książce:</p><div class="coll">${nd}</div>`:''}<p style="color:var(--muted)">Najlepszy wynik: noc ${meta.best}</p>
    <button class="btn b-orange" data-act="home">ZAMKNIJ LODÓWKĘ</button>`);}

/* ================= OVERLAYS ================= */
function overlay(html){const o=$('#overlay');o.innerHTML=`<div class="sheet" role="dialog">${html}</div>`;o.hidden=false;paused=true;}
function closeOverlay(){$('#overlay').hidden=true;paused=false;}
function showHelp(){overlay(`<h2>JAK GRAĆ</h2><ol class="howto">
  <li><b>Rano targ.</b> Stuknij kartę, potem KUP (3 monety). Stuknij jeszcze raz albo ANULUJ, żeby odznaczyć.</li>
  <li><b>3 takie same łączą się same</b> w lepszą formę: Ziemniak ★ → Pieczony ziemniak ★★ → Placki ★★★.</li>
  <li><b>Nocą walka idzie sama.</b> Pierwszy z lewej bije się z pierwszym potworem. Kto padnie, ustępuje miejsca.</li>
  <li><b>Kolor ramki karty</b> to rzadkość: szary od nocy 1, niebieski od 3, fioletowy od 5.</li>
  <li><b>Przegrana noc</b> zabiera Zakwasowi serce. Przetrwaj 10 nocy.</li></ol>
  <button class="btn b-orange" data-act="close">ROZUMIEM</button>`);}
function showColl(){overlay(`<h2>KSIĄŻKA KUCHARSKA</h2><p>Dania ★★★, które udało ci się ugotować: ${meta.dishes.length}/12</p>
  <div class="coll">${Object.keys(KINDS).map(k=>{const on=meta.dishes.includes(k);return `<div class="${on?'':'lock'}"><img class="px" src="${IMG[k][2]}" alt="">${on?KINDS[k].n[2]:'???'}</div>`;}).join('')}</div>
  <button class="btn b-orange" data-act="close">ZAMKNIJ</button>`);}

/* ================= INPUT ================= */
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-act]');if(!t)return;ac();const act=t.dataset.act,i=+t.dataset.i;
  switch(act){
    case 'play':SFX.buy();$('#title').hidden=true;$('#game').hidden=false;newRun();renderAll();defaultCenter();break;
    case 'help':SFX.tap();showHelp();break;
    case 'coll':SFX.tap();showColl();break;
    case 'close':SFX.tap();closeOverlay();break;
    case 'mute':muted=!muted;renderHUD();break;
    case 'card':if(run.phase!=='shop'||run.shop[i].sold)break;if(run.sel&&run.sel.type==='shop'&&run.sel.i===i)select(null);else select({type:'shop',i});break;
    case 'buy':buy();break;
    case 'cancel':select(null);break;
    case 'slot':onSlot(i);break;
    case 'sell':sell();break;
    case 'enemy':{const e=(run.phase==='fight'?B.enemies:run.preview)[i];if(e){SFX.tap();center(e.n,`Atak ${e.a} · Życie ${Math.max(0,e.h)}. ${e.ab}`);}break;}
    case 'reroll':if(run.coins>=1){const old=run.coins;run.coins--;rollShop();run.sel=null;SFX.whoosh();renderAll();countTo($('#coinN'),old,run.coins);
      document.querySelectorAll('.card').forEach((c,j)=>{c.style.animationDelay=j*.3+'s';anim(c,'pop');});defaultCenter();}break;
    case 'night':if(run.team.some(Boolean))startNight();break;
    case 'speed':run.speed=run.speed===1?2:run.speed===2?3:1;renderActions();break;
    case 'next':nextDay();break;
    case 'home':closeOverlay();run=null;B=null;mood='calm';bgSpeed=1;$('#game').hidden=true;$('#title').hidden=false;renderTitle();break;
  }});
renderTitle();
})();
</script>
