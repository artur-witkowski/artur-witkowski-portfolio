<title>Midnight Pantry</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap">
<style>
/* Layout: the phone screen IS the kitchen at midnight. Title = closed fridge door with magnet letters.
   Game = open fridge (frosty freezer with monsters on top, lit cavity with your glass shelf), wooden counter with the day's groceries below.
   Transitions: door opens/closes, night darkens the fridge, merges cook in a pan, mornings print a receipt. Single deliberate look. */
:root{
  --ink:#140E1C; --paper:#FFF9E8; --text:#F4EFE6; --muted:#A79FBF;
  --enamel:#E6ECF1; --enamel-d:#B9C6D2; --frost:#BFDDE9; --night:#151B2E;
  --gold:#FFC93C; --atk:#FFB020; --hp:#E8435A;
  --orange:#FF7A1A; --orange-d:#B34D00; --blue:#2F7CF6; --blue-d:#1B4FA8; --green:#27C46B; --green-d:#17834A;
  --red:#EF4444; --red-d:#A12828; --gray:#4A4560; --gray-d:#2D2A3D;
  --r1:#B9B2C8; --r2:#4FA3FF; --r3:#C77DFF;
  --f:'Jersey 10','Courier New',monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#0F1220;color:var(--text);font-family:var(--f);font-size:20px;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
img.px,.pxbg{image-rendering:pixelated;image-rendering:crisp-edges}
img.px{display:block}
.crt{position:fixed;inset:0;pointer-events:none;z-index:300;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
.crt::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.55) 100%)}
#wall{position:fixed;inset:0;background-image:var(--tex-tiles);background-size:64px 64px;image-rendering:pixelated;z-index:0}
#wall::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 45%,rgba(190,225,255,.10),transparent 70%)}
#app{position:relative;z-index:1;height:100%;max-width:440px;margin:0 auto;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-direction:column;perspective:950px;perspective-origin:50% 45%}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}

/* buttons */
.btn{font-family:var(--f);font-size:24px;letter-spacing:.02em;color:#fff;border-radius:12px;padding:10px 12px;line-height:1;box-shadow:0 5px 0 var(--d,#000);transition:transform .06s,box-shadow .06s;text-shadow:1px 2px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--d,#000)}
.btn[disabled]{filter:grayscale(.8) brightness(.6);pointer-events:none}
.b-orange{background:var(--orange);--d:var(--orange-d)}.b-blue{background:var(--blue);--d:var(--blue-d)}.b-green{background:var(--green);--d:var(--green-d)}.b-red{background:var(--red);--d:var(--red-d)}.b-gray{background:var(--gray);--d:var(--gray-d)}
.wiggle{animation:wig 2.6s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}

/* ---------- DOOR (title + transitions) ---------- */
#door{position:absolute;inset:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));z-index:90;transform-origin:left center;transform-style:preserve-3d}
#door .front{position:absolute;inset:0;-webkit-backface-visibility:hidden;border-radius:26px 26px 18px 18px;background-color:var(--enamel);background-image:linear-gradient(90deg,rgba(255,255,255,.35),transparent 18%,transparent 80%,rgba(80,100,120,.25)),var(--tex-enamel);background-size:auto,64px 64px;background-blend-mode:normal,multiply;transition:background-color .35s;box-shadow:inset 0 -10px 0 var(--enamel-d),0 30px 60px rgba(0,0,0,.6);color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:22px 46px 22px 22px;box-sizing:border-box;gap:16px;backface-visibility:hidden}
#door .back{position:absolute;inset:0;border-radius:26px 26px 18px 18px;transform:rotateY(180deg) translateZ(24px);-webkit-backface-visibility:hidden;backface-visibility:hidden;background:#EEF2F5;box-shadow:inset 0 0 0 10px #C3CCD5,inset 0 0 0 13px #9FAAB6,inset 0 0 50px rgba(0,0,0,.18);display:flex;flex-direction:column;justify-content:space-around;padding:50px 28px;box-sizing:border-box}
#door .bin{height:78px;display:flex;align-items:flex-end;justify-content:center;gap:2px;border-bottom:16px solid rgba(185,220,236,.85);border-radius:0 0 8px 8px;box-shadow:0 6px 0 rgba(0,0,0,.08)}
#door .bin img{width:56px;height:56px;margin-bottom:-6px}
#door .edge{position:absolute;top:10px;bottom:10px;left:100%;width:24px;transform-origin:left center;transform:rotateY(90deg);background:linear-gradient(90deg,#E4EAEF,#A3AFBB);border-radius:0 6px 6px 0}
#door .dshade{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,rgba(10,15,30,.1),rgba(10,15,30,.65));opacity:0;pointer-events:none;z-index:5}
.mist{will-change:transform,opacity;position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(235,248,255,.5),rgba(235,248,255,0) 70%);pointer-events:none;z-index:89}
#door .seam{position:absolute;left:0;right:0;top:27%;height:6px;background:var(--enamel-d);box-shadow:0 2px 0 rgba(255,255,255,.6)}
#door .handle{position:absolute;right:14px;width:12px;border-radius:6px;background:linear-gradient(90deg,#F4F4F4,#9BA3AD);box-shadow:3px 3px 0 rgba(0,0,0,.25)}
#door .h1{top:8%;height:13%}#door .h2{top:34%;height:22%}
#door .badge{position:absolute;top:14px;right:44px;font-size:14px;letter-spacing:.24em;padding:2px 8px;border-radius:4px;color:#5d5850;background:linear-gradient(180deg,#F4F4F4,#9BA3AD)}
.mlogo{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:3%}
.mword{display:flex;gap:2px}
.mletter{display:inline-block;font-size:clamp(48px,14vw,66px);line-height:.9;color:var(--c);transform:rotate(var(--r));text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),5px 7px 0 rgba(0,0,0,.25)}
.parade{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:2%}
.parade img{width:48px;height:48px;animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.25))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
.titlebtns{display:flex;flex-direction:column;gap:12px;width:min(100%,280px);margin-top:auto}
.titlebtns .btn{font-size:28px;padding:14px}
.tb2{display:flex;gap:8px}.tb2 .btn{flex:1;font-size:20px;padding:12px 4px}
.sticky{background:#FFE98A;color:#3A2E10;padding:10px 12px 8px;transform:rotate(-2deg);box-shadow:3px 5px 0 rgba(0,0,0,.2);font-size:20px;line-height:1.1;width:min(100%,260px);text-align:left;position:relative}
.sticky::before{content:"";position:absolute;top:-8px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--hp);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.sticky b{color:#B3261E;font-weight:400}
.dishmags{position:absolute;left:18px;bottom:22px;display:flex;flex-wrap:wrap;gap:4px;width:150px;pointer-events:none}
.dishmags img{width:32px;height:32px;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.3))}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:8px;height:44px}
.jar{position:relative;width:34px;height:42px;border:3px solid var(--ink);border-top-width:6px;border-radius:6px 6px 10px 10px;background:rgba(220,235,245,.25);overflow:hidden;box-sizing:border-box}
.jar i{position:absolute;left:0;right:0;bottom:0;background:#F3E3BC;transition:height .5s;box-shadow:inset 0 3px 0 #FFF6DA}
.jar i::after{content:"";position:absolute;left:5px;top:6px;width:4px;height:4px;background:#fff;animation:bub 1.8s infinite}
@keyframes bub{0%{transform:translateY(8px);opacity:0}50%{opacity:1}100%{transform:translateY(-6px);opacity:0}}
.jarlbl{display:flex;flex-direction:column;line-height:.9;font-size:16px;color:var(--muted)}
.jarlbl b{font-weight:400;font-size:24px;color:#FFE3A8}
.cal{width:44px;height:42px;background:var(--paper);color:var(--ink);border-radius:4px;display:flex;flex-direction:column;align-items:center;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.4);margin-left:6px}
.cal b{width:100%;background:var(--hp);color:#fff;font-weight:400;font-size:14px;text-align:center;line-height:14px}
.cal span{font-size:28px;line-height:26px}
.clock{font-size:26px;color:#9FE6FF;background:#0B1424;border:2px solid #22324F;border-radius:8px;padding:2px 8px;text-shadow:0 0 6px rgba(120,220,255,.7);font-variant-numeric:tabular-nums}
.hud .sp{flex:1}
.coins{display:flex;align-items:center;gap:6px;font-size:28px;color:var(--gold);text-shadow:2px 2px 0 rgba(0,0,0,.6)}
.coins img{width:24px;height:24px}
.iconbtn{width:36px;height:36px;border-radius:10px;background:rgba(20,16,30,.8);border:2px solid #3D3456;display:grid;place-items:center;font-size:22px}

/* ---------- FRIDGE ---------- */
.fridge{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px;border-radius:20px;background-color:var(--enamel);background-image:var(--tex-enamel);background-size:64px 64px;box-shadow:inset 0 -6px 0 var(--enamel-d),0 0 50px rgba(170,215,255,.18);gap:6px;position:relative}
.freezer{position:relative;border-radius:12px;padding:4px 6px 8px;background-color:var(--frost);background-image:var(--tex-frost);background-size:64px 64px;box-shadow:inset 0 0 0 3px #E8F6FB,inset 0 0 18px 4px rgba(255,255,255,.85),inset 0 12px 18px rgba(80,140,170,.35),0 0 0 4px #B6C1CB;transition:box-shadow .6s,filter .6s}
.freezer::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:10px;background:radial-gradient(circle at 6px 0,#fff 5px,transparent 5.5px) repeat-x;background-size:14px 10px;opacity:.9;pointer-events:none}
.flab{font-size:16px;letter-spacing:.14em;color:#4E7F92;display:flex;justify-content:space-between;padding:0 4px}
.cavity{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;border-radius:12px;background:repeating-linear-gradient(90deg,rgba(110,130,150,.07) 0 3px,transparent 3px 26px),linear-gradient(180deg,#FFFCEE 0%,#EEF3F7 45%,#D9E3EA 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.8),0 0 0 4px #B6C1CB;transition:background .6s;overflow:hidden}

.cavity::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 55% at 50% 0%,rgba(255,244,190,.35),transparent 70%);pointer-events:none;transition:opacity .4s}
#center{flex:1;min-height:56px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:2px;padding:26px 30px 0;color:var(--ink);position:relative;z-index:2}
#center .ct{font-size:30px;line-height:1;color:#B3261E}
#center .cd{font-size:20px;line-height:1.1;max-width:330px;color:#2A2238}
#center .cd em{font-style:normal;color:#C2410C}
#center .tag{display:inline-block;font-size:15px;padding:1px 6px;border-radius:5px;background:var(--ink);color:var(--gold);margin-right:4px;vertical-align:2px}
.clash{display:flex;align-items:center;gap:16px}
.clash .n{font-size:54px;line-height:.9;text-shadow:3px 3px 0 var(--ink)}
.clash .n.a{color:var(--atk)}.clash .n.e{color:var(--hp)}
.clash .vs{font-size:18px;color:#5B5470}
.row{display:flex;gap:4px;justify-content:center;align-items:flex-end;min-height:96px;position:relative;z-index:2}
.shelfrow{padding:0 4px}
.glass{position:relative;height:32px;margin-top:-16px;z-index:1;pointer-events:none}
.glass::before{content:"";position:absolute;left:0;right:0;top:0;height:24px;background:linear-gradient(180deg,rgba(215,242,252,.4),rgba(160,215,236,.65));clip-path:polygon(28px 0,calc(100% - 28px) 0,100% 100%,0 100%)}
.glass i{position:absolute;left:0;right:0;top:24px;height:7px;background:linear-gradient(180deg,#FFFFFF 0 2px,rgba(130,195,218,.9) 2px);border-radius:0 0 3px 3px;box-shadow:0 5px 10px rgba(40,70,90,.25)}
.wallL,.wallR{position:absolute;top:0;bottom:0;width:28px;z-index:0;pointer-events:none;transition:filter .6s}
.wallL{left:0;background:linear-gradient(90deg,#A9B6C2,#D6DEE5);clip-path:polygon(0 0,100% 26px,100% calc(100% - 34px),0 100%)}
.wallR{right:0;background:linear-gradient(270deg,#A9B6C2,#D6DEE5);clip-path:polygon(0 26px,100% 0,100% 100%,0 calc(100% - 34px))}
.ceil{position:absolute;top:0;left:0;right:0;height:26px;z-index:0;background:linear-gradient(#FBFCFD,#E1E8EE);clip-path:polygon(0 0,100% 0,calc(100% - 28px) 100%,28px 100%);transition:filter .6s}
.led{position:absolute;left:32%;right:32%;top:8px;height:7px;border-radius:4px;background:#FFFBE0;box-shadow:0 0 14px 6px rgba(255,246,200,.85);transition:all .3s}
.unit{position:relative;flex:0 1 64px;min-width:40px;width:64px;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .12s}
.unit .sp{width:64px;max-width:100%;height:auto;aspect-ratio:1;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.25))}
.unit.empty{height:84px;border:3px dashed rgba(90,110,130,.35);border-radius:12px;box-sizing:border-box}
.unit.sel{transform:translateY(-8px)}
.unit.sel .sp{filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 6px var(--gold))}
.unit.swapok{outline:2px dashed #C2410C;outline-offset:2px;border-radius:12px}
.unit.dead .sp{filter:grayscale(1) sepia(.6) hue-rotate(50deg) brightness(.55)}
.unit.dead{opacity:.6}
.unit.front::before{content:"▼";position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:14px;color:#C2410C;animation:arrow .8s ease-in-out infinite}
@keyframes arrow{50%{transform:translate(-50%,4px)}}
.enemy.front::before{color:#B3261E}
.stars{height:16px;font-size:18px;line-height:16px;color:var(--gold);letter-spacing:-1px;text-shadow:1px 1px 0 var(--ink),-1px 0 0 var(--ink)}
.badges{display:flex;justify-content:space-between;width:64px;max-width:100%;margin-top:-10px;position:relative;z-index:2}
.bdg{min-width:24px;height:24px;padding:0 3px;box-sizing:border-box;border-radius:6px;display:grid;place-items:center;font-size:20px;color:#fff;border:2px solid var(--ink);text-shadow:1px 1px 0 rgba(0,0,0,.4)}
.bdg.a{background:var(--atk);color:var(--ink);text-shadow:none;border-radius:5px}.bdg.h{background:var(--hp);border-radius:50%}
.pips{display:flex;gap:3px;height:8px;margin-top:3px}
.pips i{width:8px;height:6px;border-radius:2px;background:rgba(60,70,90,.35)}
.pips i.on{background:var(--gold);box-shadow:0 0 0 1px var(--ink)}
.enemy .badges{width:100%}
.enemy.boss{flex-basis:96px;width:96px}.enemy.boss .sp{width:96px}
/* idle life, drag & drop, hints, arena */
.unit,.card{touch-action:none}
img{-webkit-user-drag:none;user-select:none}
.unit img,.card img{pointer-events:none}
.bob{animation:idle 2.4s ease-in-out infinite}
.freezer .bob{animation:idleE 1.7s ease-in-out infinite}
@keyframes idle{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-2px) scaleY(1.03)}}
@keyframes idleE{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(1px) scale(1.04,.96)}}
.unit.out{opacity:.22}
.unit.dragging,.card.dragging{opacity:.3}
.ghost{position:absolute;z-index:75;width:72px;height:72px;pointer-events:none;filter:drop-shadow(4px 8px 0 rgba(0,0,0,.35));transform:rotate(-8deg) scale(1.1)}
.unit.droptarget{outline:3px solid var(--green);outline-offset:2px;border-radius:12px;background:rgba(39,196,107,.15)}
.unit.empty.hintslot{border-color:var(--green);animation:slotp 1s ease-in-out infinite}
@keyframes slotp{50%{background:rgba(39,196,107,.18)}}
.unit.mergeglow .sp{filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 7px var(--gold))}
.unit.mergeglow::after{content:"+1";position:absolute;top:-4px;right:-2px;background:var(--green);color:#fff;border:2px solid var(--ink);border-radius:6px;font-size:15px;padding:0 4px;animation:arrow2 .8s ease-in-out infinite}
@keyframes arrow2{50%{transform:translateY(-3px)}}
.arena{display:flex;flex-direction:column;align-items:center;width:100%;gap:2px}
.arena .duel{display:flex;align-items:center;justify-content:space-between;width:100%;gap:4px}
.fighter{display:flex;flex-direction:column;align-items:center;position:relative;width:96px}
.fighter .sp{width:96px;height:96px;filter:drop-shadow(3px 5px 0 rgba(0,0,0,.3))}
.fighter .badges{width:84px;margin-top:-12px}
.fighter .bdg{min-width:30px;height:30px;font-size:24px}
.arena .mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.arena .sn{font-size:16px;letter-spacing:.1em;color:#7C7491}
.arena .vsx{font-size:34px;line-height:1;color:var(--gold);text-shadow:2px 2px 0 var(--ink)}
.arena .cap{font-size:19px;line-height:1.05;text-align:center;min-height:22px;max-width:330px;position:relative;z-index:3}
.lungeR{animation:lr .3s ease-out}@keyframes lr{45%{transform:translateX(28px) scale(1.15) rotate(6deg)}}
.lungeL{animation:ll .3s ease-out}@keyframes ll{45%{transform:translateX(-28px) scale(1.15) rotate(-6deg)}}
/* door note (post-it summary) */
#dim{position:absolute;inset:0;z-index:84;background:#04060C;opacity:0;pointer-events:none}
#doorNote{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;margin:auto 0}
.bignote{position:relative;width:min(100%,292px);background:#FFE98A;color:#3A2E10;padding:22px 18px 16px;box-sizing:border-box;transform:rotate(-2.5deg);
  box-shadow:0 1px 0 #E9CF62,4px 8px 0 rgba(0,0,0,.18),0 18px 30px rgba(0,0,0,.18);font-size:22px;line-height:1.1;
  background-image:linear-gradient(transparent 0 calc(100% - 26px),rgba(0,0,0,.05) calc(100% - 26px)),repeating-linear-gradient(transparent 0 27px,rgba(150,120,40,.18) 27px 28px)}
.bignote::before{content:"";position:absolute;top:-10px;left:50%;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a85,var(--hp) 60%,#8f2232);box-shadow:0 3px 0 rgba(0,0,0,.3)}
.bignote::after{content:"";position:absolute;right:0;bottom:0;width:26px;height:26px;background:linear-gradient(135deg,#F6D55C 50%,rgba(0,0,0,.12) 50%)}
.bignote h3{margin:0 0 8px;font-weight:400;font-size:34px;line-height:.95;color:#B3261E;text-align:center}
.bignote .nl{display:flex;justify-content:space-between;gap:10px;padding:2px 0;opacity:0;transform:translateX(-6px)}
.bignote .nl.in{opacity:1;transform:none;transition:opacity .18s,transform .18s}
.bignote .nl b{font-weight:400;white-space:nowrap}
.bignote .bad{color:#B3261E}.bignote .good{color:#1E7A3C}
.bignote .sig{display:block;text-align:right;margin-top:8px;color:#8A6A1A;font-size:18px}
.bignote .big{font-size:46px;text-align:center;color:#3A2E10;margin:4px 0}
.bignote .dishes{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.bignote .dishes img{width:40px;height:40px}
#doorNote .btns{display:flex;gap:10px;width:min(100%,292px)}
#doorNote .btns .btn{flex:1;font-size:24px;padding:14px 8px}
/* fridge picker + unlocks */
.fsel{display:flex;align-items:center;gap:6px;width:min(100%,300px)}
.fbtn{width:40px;height:56px;border-radius:10px;background:rgba(20,16,30,.12);color:var(--ink);font-size:20px;flex:none}
.fname{flex:1;min-width:0;background:linear-gradient(180deg,#F4F4F4,#B9C1CA);border-radius:8px;padding:6px 8px;text-align:center;color:#2A2F38;box-shadow:inset 0 1px 0 #fff,0 2px 0 rgba(0,0,0,.25)}
.fname b{display:block;font-weight:400;font-size:24px;line-height:1;letter-spacing:.08em;text-transform:uppercase}
.fname small{display:block;font-size:16px;line-height:1.05;color:#4A5160;margin-top:2px}
.fdots{display:flex;gap:4px;justify-content:center;margin-top:4px}
.fdots i{width:7px;height:7px;border-radius:50%;background:#8E96A3}.fdots i.on{background:var(--orange)}.fdots i.lk{opacity:.4}
#door.darkdoor .front{color:#E8EDF5}

.nickrow{display:flex;align-items:center;gap:8px;font-size:18px}

.bignote .mini{font-size:18px;display:flex;flex-direction:column;gap:1px;margin-top:4px}

/* tiers */
.card{background:var(--rb,var(--paper))}
.card.t3,.card.t4{border-width:4px}
.card .tier{position:absolute;top:-11px;left:-11px;min-width:30px;height:30px;padding:0 3px;box-sizing:border-box;border-radius:50% 50% 50% 8px;background:var(--rc);border:2px solid var(--ink);display:grid;place-items:center;font-size:18px;color:#fff;text-shadow:1px 1px 0 var(--ink);z-index:2}
.card.t4::before{content:"";position:absolute;inset:0;border-radius:6px;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.75) 45%,transparent 60%);background-size:260% 100%;animation:shine 2.2s linear infinite;pointer-events:none}

.card.held{box-shadow:0 0 0 3px #8FD3F0,0 5px 0 rgba(40,20,10,.55);animation:none}
.card.held::after{content:"TRZYMAM";position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;border:2px solid var(--ink);border-radius:6px;font-size:15px;padding:0 5px}
.unit .tnum{position:absolute;top:13px;left:-3px;z-index:3;min-width:20px;height:18px;border-radius:5px;background:var(--tc);border:2px solid var(--ink);color:#fff;font-size:14px;line-height:15px;text-align:center;padding:0 2px;box-sizing:border-box;text-shadow:1px 1px 0 var(--ink)}

.counter.sellzone::after{content:"UPUŚĆ, ŻEBY SPRZEDAĆ";position:absolute;inset:0;display:grid;place-items:center;font-size:30px;color:#fff;background:rgba(160,30,30,.6);border-radius:14px;text-shadow:2px 2px 0 var(--ink);z-index:5}
/* night */
#game.night .cavity{background:linear-gradient(180deg,rgba(30,40,70,.95),rgba(18,24,44,.97))}

/* ---------- COUNTER ---------- */
.counter{position:relative;border-radius:14px 14px 10px 10px;padding:8px 8px 10px;background-color:#8A5A34;background-image:var(--tex-wood);background-size:128px 64px;box-shadow:inset 0 5px 0 #A9744A,0 5px 0 #4A2E18;transition:filter .6s}
.clabel{position:absolute;top:-12px;left:14px;background:var(--paper);color:var(--ink);font-size:16px;letter-spacing:.1em;padding:1px 8px;border-radius:4px;transform:rotate(-2deg);box-shadow:2px 2px 0 rgba(0,0,0,.3)}
.shop{display:flex;gap:8px;justify-content:center;align-items:flex-end;min-height:128px;padding-top:10px}
.card{position:relative;width:86px;height:118px;background:var(--paper);color:var(--ink);border:3px solid var(--rc,var(--r1));border-radius:10px;box-shadow:0 5px 0 rgba(40,20,10,.55),inset 0 0 0 2px var(--ink);display:flex;flex-direction:column;align-items:center;padding-top:6px;box-sizing:border-box;transition:transform .15s}

.actions{display:flex;gap:8px;height:54px;margin-top:6px}
.actions .btn{flex:1;padding-inline:6px}

/* ---------- FX ---------- */
#fx{position:absolute;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.ftxt{position:absolute;white-space:nowrap;transform:translate(-50%,-50%);text-shadow:2px 2px 0 #000,-1px -1px 0 #000,2px -1px 0 #000,-1px 2px 0 #000}
.part{position:absolute;width:6px;height:6px}
#flash{position:absolute;inset:0;z-index:95;pointer-events:none;background:#FFFBEA;opacity:0}
#banner{position:absolute;left:0;right:0;top:34%;z-index:85;background:#7A0E1E;color:#FFE3A8;text-align:center;font-size:40px;padding:8px 0;box-shadow:0 0 0 4px var(--ink),0 0 40px rgba(240,64,90,.6);text-shadow:3px 3px 0 var(--ink)}

.flashk{animation:flashk .25s}
@keyframes flashk{0%{filter:brightness(3) saturate(0)}100%{filter:none}}
.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.lungeU{animation:lu .28s ease-out}@keyframes lu{45%{transform:translateY(-22px) scale(1.14)}}
.lungeD{animation:ld .28s ease-out}@keyframes ld{45%{transform:translateY(22px) scale(1.14)}}

/* ================= SOUND ================= */
let AC=null,muted=false,hum=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,vol,slide,delay){if(muted)return;const a=ac();if(!a)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
  g.gain.setValueAtTime(vol||.04,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03);}
function noise(d,freq,vol,q){if(muted)return;const a=ac();if(!a)return;const len=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,len,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.5);const s=a.createBufferSource();s.buffer=buf;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q||.7;
  const g=a.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(a.destination);s.start();}
function humOn(night){humOff();if(muted)return;const a=ac();if(!a)return;const o=a.createOscillator(),o2=a.createOscillator(),g=a.createGain();
  o.type='triangle';o.frequency.value=night?41:58;o2.type='sine';o2.frequency.value=night?61.7:116;g.gain.setValueAtTime(0,a.currentTime);g.gain.linearRampToValueAtTime(night?.05:.025,a.currentTime+.8);
  o.connect(g);o2.connect(g);g.connect(a.destination);o.start();o2.start();hum={o,o2,g,a,night};}
function humOff(){if(!hum)return;const{o,o2,g,a}=hum;g.gain.cancelScheduledValues(a.currentTime);g.gain.setValueAtTime(g.gain.value,a.currentTime);g.gain.linearRampToValueAtTime(0,a.currentTime+.25);o.stop(a.currentTime+.3);o2.stop(a.currentTime+.3);hum=null;}
const SFX={
  tap:()=>tone(700,.04,'square',.025),
  buy:()=>{tone(523,.06,'square',.04);tone(784,.09,'square',.04,0,.06);},
  plop:()=>tone(300,.09,'sine',.08,.5),
  coin:i=>tone(988+(i||0)*60,.07,'square',.035),
  tick:()=>tone(2400,.02,'square',.02),
  sizzle:()=>noise(.8,3500,.18,.6),
  merge:()=>[523,659,784,1046,1318,1568].forEach((f,i)=>tone(f,.14,'square',.045,0,i*.055)),
  hit:()=>{tone(180,.12,'sawtooth',.05,.45);noise(.08,900,.12);},
  hurt:()=>tone(120,.16,'square',.045,.6),
  splat:()=>noise(.25,500,.25,1.2),
  block:()=>tone(1400,.05,'triangle',.04),
  die:()=>tone(420,.3,'triangle',.05,.2),
  heal:()=>{tone(660,.08,'triangle',.04);tone(880,.1,'triangle',.04,0,.07);},
  thud:()=>{tone(90,.25,'sine',.25,.45);noise(.12,200,.3);},
  seal:()=>{noise(.14,320,.3,.8);tone(140,.12,'sine',.08,.6);},
  creak:()=>tone(220,.5,'sawtooth',.015,.6),
  ice:()=>noise(.15,6000,.12,2),
  boss:()=>[110,104,98].forEach((f,i)=>tone(f,.4,'sawtooth',.05,0,i*.35)),
  win:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.2,'triangle',.06,0,i*.1)),
  lose:()=>[392,330,262,196].forEach((f,i)=>tone(f,.24,'triangle',.06,0,i*.14)),
  whoosh:()=>tone(800,.18,'sawtooth',.018,.3)
};

/* ================= NATIVE (Capacitor) — no-ops inside the artifact / a browser ================= */
const CAP=window.Capacitor,NATIVE=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform());
function haptic(style){if(!NATIVE||muted)return;try{CAP.Plugins.Haptics.impact({style});}catch(e){}}
[['thud','HEAVY'],['merge','MEDIUM'],['hit','LIGHT'],['seal','LIGHT'],['plop','LIGHT'],['boss','HEAVY']].forEach(([k,st])=>{const f=SFX[k];SFX[k]=(...x)=>{haptic(st);return f(...x);};});
if(NATIVE){try{CAP.Plugins.StatusBar.setStyle({style:'DARK'});}catch(e){}}

/* ================= PIXEL TEXTURES (drawn small, scaled up crisp) ================= */
function tex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');fn(x,w,h);return c.toDataURL();}
function dots(x,n,cols,w,h){for(let i=0;i<n;i++){x.fillStyle=rnd(cols);x.fillRect(Math.floor(R(0,w)),Math.floor(R(0,h)),1,1);}}
const TEX={

  frost:tex(16,16,(x)=>{x.fillStyle='#BFDDE9';x.fillRect(0,0,16,16);dots(x,16,['#D9EEF6','#FFFFFF','#ACD0DE'],16,16);x.fillStyle='#fff';x.fillRect(3,2,1,5);x.fillRect(1,4,5,1);x.fillRect(12,10,1,3);x.fillRect(11,11,3,1);}),

  run={seed,daily:!!daily,fridge:F,freeRoll:!!F.freeRoll,newUnlocks:[],log:[],night:1,hp:MAXHP,coins:BUDGET,team:Array(SLOTS).fill(null),shop:[],sel:null,phase:'shop',speed:1,won:0,newDishes:[],clock:8*60};rollShop();}
function odds(){return ODDS[Math.min(run.night+((run.fridge&&run.fridge.oddsShift)||0),10)-1];}
function pickTier(){const o=odds();let r=rng()*100;for(let i=0;i<o.length;i++){r-=o[i];if(r<0)return i+1;}return 1;}
function rollShop(keepHeld){const held=keepHeld&&run.shop?run.shop.filter(c=>c.held&&!c.sold).map(c=>({k:c.k,held:true})):[];
  const n=run.night>=3?4:3,maxT=odds().length;
  const owned=run.team.filter(u=>u&&!u.tok&&u.t<3&&KINDS[u.k].r<=maxT&&kindAvail(u.k)).map(u=>u.k);const fresh=[];
  const pool=t=>Object.keys(KINDS).filter(x=>KINDS[x].r===t&&kindAvail(x));
  while(held.length+fresh.length<n){let k=owned.length&&rng()<.3?srnd(owned):null;if(!k){let t=pickTier();while(t>1&&!pool(t).length)t--;k=srnd(pool(t));}fresh.push({k});}
  run.shop=held.concat(fresh);}
function owner(k){return run.team.findIndex(u=>u&&u.k===k);}
function mkEnemy(k){const d=ENEMIES[k],n=run.night;const h=d.h+(d.boss?0:Math.round((n-1)*1.4))+((run.fridge&&run.fridge.enemyHp)||0),a=d.a+(d.boss?0:Math.floor((n-1)/2.5));return Object.assign({},d,{k,uid:++uid,a,h,max:h,clash:0});}
function unitName(u){return u.tok?TOKENS[u.k].n:KINDS[u.k].n[u.t-1];}
function unitImg(u){return u.tok?IMG[u.k][0]:IMG[u.k][u.t-1];}

async function buy(si,slot){if(busy||si==null)return;const c=run.shop[si];if(!c||c.sold)return;

    if(target<0){say('Półka pełna','Sprzedaj coś, żeby zrobić miejsce.');return;}}

  busy=true;run.log.push(['b',si,slot==null?-1:slot]);if(!run.daily)meta.stats.bought++;const old=run.coins;run.coins-=p;countTo($('#coinN'),old,run.coins);c.sold=true;run.sel=null;SFX.buy();

/* ================= DAILY LEADERBOARD =================
   Two backends behind one small interface:
   - inside the claude.ai artifact: the artifact's shared db (one doc per player: lb/<userId>), names from the viewer's account;
   - in the app (or any page that sets window.MP_API): the Cloudflare Worker in ../server, with a per-device id and a nickname.
   Without either, results stay local. */
const LB={mode:null,db:null,user:null,me:null,_ready:null,
  init(){if(this._ready)return this._ready;this._ready=(async()=>{
    if(window.claude&&window.claude.use){try{const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      if(db&&user){const id=await user.id();if(id){this.db=db;this.user=user;this.me=id;this.mode='artifact';return true;}}}catch(e){}}
    if(window.MP_API){this.mode='http';this.me=devId();return true;}
    this.mode='local';return false;})();return this._ready;},
  async submit(date,entry){if(!await this.init())return 'local';
    try{if(this.mode==='artifact'){const ref=this.db.doc('lb/'+this.me);const cur=await ref.get();const d=cur.exists?cur.data():null;
        if(d&&d.date===date&&d.score>=entry.score)return 'kept';await ref.set(Object.assign({date},entry));return 'saved';}
      const r=await fetch(`${window.MP_API}/daily/${date}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.assign({player:this.me,name:nick()},entry))});
      return r.ok?(await r.json()).status:'error';}catch(e){return 'error';}},
  async top(date,n){if(!await this.init())return null;
    try{if(this.mode==='artifact'){const q=await this.db.collection('lb').where('date','==',date).orderBy('score','desc').limit(n||25).get();
        const rows=q.docs.map(d=>Object.assign({id:d.id},d.data()));const ps=await this.user.profiles(rows.map(r=>r.id));
        return rows.map(r=>Object.assign(r,{name:(ps[r.id]&&ps[r.id].name)||'Ktoś',avatar:ps[r.id]&&ps[r.id].avatarUrl,isMe:r.id===this.me}));}
      const r=await fetch(`${window.MP_API}/daily/${date}?limit=${n||25}`);if(!r.ok)return null;const j=await r.json();
      return j.rows.map(x=>Object.assign(x,{isMe:x.player===this.me}));}catch(e){return null;}}};
function devId(){try{let v=localStorage.getItem('mp-device');if(!v){v='d'+Math.random().toString(36).slice(2,12);localStorage.setItem('mp-device',v);}return v;}catch(e){return 'anon';}}
function nick(){try{return localStorage.getItem('mp-nick')||('Kucharz '+devId().slice(1,5).toUpperCase());}catch(e){return 'Kucharz';}}
function withTimeout(p,ms){return Promise.race([p,new Promise(r=>setTimeout(()=>r('timeout'),ms))]);}
function rankRows(rows){return rows.map((r,i)=>`<div class="rk ${r.isMe?'me':''}"><span class="rp">${i+1}</span>${r.avatar?`<img src="${r.avatar}" alt="">`:'<i></i>'}<span class="rn"></span><span class="rnight">noc ${r.night}</span><b>${r.score}</b></div>`).join('');}

    ${LB.mode==='http'?`<label class="nickrow">Twój nick <input id="nickIn" maxlength="16" value="${nick().replace(/"/g,'')}"></label>`:''}
    <button class="btn b-green" data-act="daily-from-rank">ZAGRAJ DANIE DNIA</button><button class="btn b-gray" data-act="close">ZAMKNIJ</button></div>`,'mid');

document.addEventListener('pointerdown',ev=>{if(!run||run.phase!=='shop'||busy)return;
  const el=ev.target.closest('.card[data-act="card"],#tRow .unit:not(.empty)');if(!el)return;
  drag={el,x:ev.clientX,y:ev.clientY,started:false,type:el.classList.contains('card')?'card':'unit',i:+el.dataset.i,ghost:null,over:null};});
function startDrag(){drag.started=true;const src=drag.type==='card'?IMG[run.shop[drag.i].k][0]:unitImg(run.team[drag.i]);
  const g=document.createElement('img');g.src=src;g.className='px ghost';fx.appendChild(g);drag.ghost=g;drag.el.classList.add('dragging');SFX.tap();
  if(drag.type==='card'){const o=owner(run.shop[drag.i].k);document.querySelectorAll('#tRow .unit').forEach((u,j)=>{if(o<0&&u.classList.contains('empty'))u.classList.add('hintslot');if(o===j)u.classList.add('mergeglow');});}}
document.addEventListener('pointermove',ev=>{if(!drag)return;const dx=ev.clientX-drag.x,dy=ev.clientY-drag.y;
  if(!drag.started){if(dx*dx+dy*dy<100)return;startDrag();}
  const g=app.getBoundingClientRect();drag.ghost.style.left=(ev.clientX-g.left-36)+'px';drag.ghost.style.top=(ev.clientY-g.top-60)+'px';
  const t=document.elementFromPoint(ev.clientX,ev.clientY);let slot=t&&t.closest('#tRow .unit');if(slot===drag.el)slot=null;
  const sz=drag.type==='unit'&&t&&t.closest('.counter');document.querySelector('.counter').classList.toggle('sellzone',!!sz);drag.sell=!!sz;
  if(drag.over&&drag.over!==slot)drag.over.classList.remove('droptarget');if(slot)slot.classList.add('droptarget');drag.over=slot;});
function endDrag(drop){const d=drag;drag=null;if(!d||!d.started)return;suppress=true;setTimeout(()=>{suppress=false;},60);
  if(d.ghost)d.ghost.remove();d.el.classList.remove('dragging');document.querySelectorAll('.droptarget,.hintslot,.mergeglow').forEach(x=>x.classList.remove('droptarget','hintslot','mergeglow'));
  document.querySelector('.counter').classList.remove('sellzone');
  if(drop&&d.sell){sellAt(d.i);return;}
  if(!drop||!d.over)return;const j=+d.over.dataset.i;
  if(d.type==='unit')swapSlots(d.i,j);else{run.sel=null;buy(d.i,j);}}
document.addEventListener('pointerup',()=>endDrag(true));
document.addEventListener('pointercancel',()=>endDrag(false));

/* ================= INPUT ================= */
document.addEventListener('click',async ev=>{if(suppress){suppress=false;return;}const t=ev.target.closest('[data-act]');if(!t)return;ac();const act=t.dataset.act,i=+t.dataset.i;
  switch(act){
    case 'play':case 'daily':{if(busy)break;busy=true;SFX.tap();newRun(act==='daily');game.hidden=false;setClock(8*60);renderAll();defaultCenter();await doorOpen();busy=false;break;}
    case 'help':SFX.tap();showHelp();break;
    case 'coll':SFX.tap();showColl();break;
    case 'rank':SFX.tap();showRank();break;
    case 'daily-from-rank':{closeOverlay();const b=document.querySelector('[data-act="daily"]');if(b)b.click();break;}
    case 'close':SFX.tap();closeOverlay();break;
    case 'mute':muted=!muted;if(muted)humOff();else humOn(game.classList.contains('night'));renderHUD();break;
    case 'card':if(!run||run.phase!=='shop'||busy||run.shop[i].sold)break;if(run.sel&&run.sel.type==='shop'&&run.sel.i===i)select(null);else select({type:'shop',i});break;
    case 'buy':if(run.sel&&run.sel.type==='shop')buy(run.sel.i);break;
    case 'cancel':select(null);break;
    case 'slot':onSlot(i);break;
    case 'sell':sell();break;
    case 'enemy':{if(!run)break;const e=(run.phase==='fight'?B.enemies:run.preview)[i];if(e){SFX.tap();say(e.n+(e.boss?' · BOSS':''),e.ab.replace('BOSS. ',''));}break;}
    case 'hold':{const s=run.sel;if(s&&s.type==='shop'){const c=run.shop[s.i];c.held=!c.held;run.log.push(['h',s.i]);SFX.block();run.sel=null;renderAll();defaultCenter();}break;}
    case 'reroll':if(run&&!busy&&run.coins>=(run.freeRoll?0:ROLL)){const old=run.coins;run.coins-=run.freeRoll?0:ROLL;run.freeRoll=false;run.log.push(['r']);rollShop(true);rollTriggers();run.sel=null;SFX.whoosh();renderAll();countTo($('#coinN'),old,run.coins);
      document.querySelectorAll('.card').forEach((c,j)=>{if(!RM)c.animate([{transform:'translateX(-120%) rotate(-20deg)',opacity:0},{transform:'none',opacity:1}],{duration:300,delay:j*70,easing:'cubic-bezier(.3,1.4,.5,1)',fill:'backwards'});});defaultCenter();}break;
    case 'night':if(run&&run.team.some(Boolean))startNight();break;
    case 'speed':run.speed=run.speed===1?2:run.speed===2?3:1;renderActions();break;
    case 'next':collect();break;
    case 'home':goHome();break;
    case 'fprev':case 'fnext':{const i0=FRIDGES.findIndex(f=>f.id===meta.fridge),d=act==='fnext'?1:-1;meta.fridge=FRIDGES[(i0+d+FRIDGES.length)%FRIDGES.length].id;saveMeta();SFX.tap();renderDoor();
      if(!RM)door.querySelector('.front').animate([{transform:'rotateY(0)'},{transform:`rotateY(${d*-3}deg)`},{transform:'rotateY(0)'}],{duration:260,easing:'ease-out'});break;}
    case 'again':{const d=run&&run.daily;await goHome();if(busy)break;busy=true;newRun(d);game.hidden=false;setClock(8*60);renderAll();defaultCenter();doorTitle(false);await doorOpen();busy=false;break;}
  }});
renderDoor();
})();
</script>
